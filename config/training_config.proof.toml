# Training profile for scripts/prove_training_works.ps1 — exercises real batching, queues,
# multi-row FF, and parallel contrastive paths (not micro-batch-16 toy throughput).
# For maximum local throughput use config/training_config.throughput_smoke.toml or your
# data-dir training_config.toml (e.g. C:/q_mini_data/config/training_config.toml).

[training]
epochs = 3
batch_size = 512
checkpoint_interval = 1
learning_rate = 1
buffer_profile = "aggressive"
samples_per_epoch = 100000
micro_batch_cap = 2048
collect_floor = 512
timing_to_stderr = false
sycl_route_mode = "auto"
sycl_trit_quant_min_moe_dim = 128
sycl_prereserve_gib = 0
sycl_gpu_device_index = -1
gf3_sycl_min_weight_cells = 0
ff_multi_row_batch = true
ff_multi_row_slots_chunk = 2048
lazy_moe_resident_cap = 0
goodness_log_level = 0
allow_generated_negatives = true
prefill_target_samples = 8192
prefill_timeout_ms = 25000
prefill_poll_ms = 3
acq_queue_cap = 32768
raw_queue_cap = 32768
train_queue_cap = 65536
acquisition_threads = 10
perturbation_threads = 10
checkpoint_async_queue_max = 48
collect_empty_backoff_base_ms = 2
collect_empty_backoff_max_shift = 8
collect_empty_backoff_cap_ms = 128
metrics_heartbeat_sec = 2
max_jsonl_local_samples = 10000
lazy_init_initial_experts = 64
parallel_contrastive_rows = true
ff_expert_chunk_size = 24
target_routes_per_batch = 32768
collect_window_ms = 100
collect_min_rows_per_batch = 16

[training.data_filter]
min_text_length = 10
max_text_length = 100000
checkpoint_interval_samples = 50000
directory_max_lines = 100000

[model]
moe_experts = 128
moe_top_k = 8
context_window = 128
entanglement_tokens = 16
shadow_dim = 32
num_layers = 2
neurons_per_layer = 32
routing_qutrits = 4
moe_input_dim = 64
moe_output_dim = 64
moe_hidden_dim = 96
expert_internal_layers = 1
moe_ff_active_internal_layers = 1
learning_rate_shift = 0

[features]
steane_correction = false
flash_cim = false
worker_threads = 12
continuous_mode = false
lazy_init = true
data_accumulation = false

[apis]
enabled = false
wolfram = false
pubchem = false
wikidata = false
arxiv = false
nasa = false
pdb = false
github = false
lean = false

[streaming]
enabled = true
port = 9090

[paths]
base_model = "checkpoints/final_model.json"
output_dir = "checkpoints/"
dataset_dir = "datasets/proof_corpus"
