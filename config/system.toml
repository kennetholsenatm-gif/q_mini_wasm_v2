# q_mini_wasm_v2 System Configuration
# 
# This file contains all mutable system parameters for the quantum-inspired
# ternary AI inference engine. All values can be modified at runtime via the WUI.
# 
# Format: TOML with CISCO IOS-style documentation
# Use '?' key in WUI editor for help on any parameter
# Press Tab to cycle through available configuration keys

# ============================================================================
# SYSTEM MEMORY CONFIGURATION
# ============================================================================

[system.memory]
# ? Size of the unified memory arena in megabytes
# Large-scale training: 512GB arena for 100B+ parameter models
# This memory is shared across WASM, C++, and SYCL layers via USM
arena_size_mb = 524288

# ? Enable Unified Shared Memory for zero-copy access
# Tab: [true, false]
# When enabled, GPU/FPGA can access host memory directly
usm_enabled = true

# ? Cache line size in bytes for memory alignment
# Tab: [32, 64, 128]
# Should match target hardware (64 for x86_64, 128 for some ARM)
cache_line_size = 64

# ? Enable page-locked memory for DMA transfers
# Tab: [true, false]
# Improves transfer speed but reduces available system memory
page_locked = true

# ? Zero-initialize all arena allocations
# Tab: [true, false]
# Slightly slower but ensures deterministic behavior
zero_initialize = false

# ============================================================================
# SYCL RUNTIME CONFIGURATION
# ============================================================================

[system.sycl]
# ? Default compute device for SYCL kernels
# Tab: ["gpu", "cpu", "fpga", "auto"]
# Auto selects best available device
default_device = "gpu"

# ? Work group size for kernel launches
# Tab: [64, 128, 256, 512]
# Larger values = more parallelism but higher memory usage
work_group_size = 256

# ? Number of nodes to cache in local memory
# Tab: [16, 32, 64]
# Affects message passing performance
local_mem_nodes = 32

# ? Enable kernel execution profiling
# Tab: [true, false]
# Adds overhead but provides timing data
queue_profiling = false

# ? Enable asynchronous kernel execution
# Tab: [true, false]
# When false, blocks until kernels complete (simpler debugging)
async_execution = true

# ============================================================================
# QGNN (QUANTUM GRAPH NEURAL NETWORK) CONFIGURATION
# ============================================================================

[system.qgnn]
# ? Default number of qutrits for new graphs
# Tab: [4, 8, 16, 32, 64]
# More qutrits = more expressive power but higher compute cost
default_num_qutrits = 8

# ? Default entanglement graph topology
# Tab: ["linear", "ring", "star", "random", "complete"]
# Affects information flow patterns
entanglement_graph = "linear"

# ? Maximum message passing iterations
# Tab: [10, 50, 100, 500]
# Higher values = better convergence but slower inference
max_iterations = 100

# ? Enable symplectic attention mechanism
# Tab: [true, false]
# Required for quantum-inspired routing
symplectic_attention = true

# ? Tolerance for convergence detection
# Tab: [0.001, 0.01, 0.1]
# Smaller values = stricter convergence criteria
convergence_tolerance = 0.01

# ============================================================================
# MoE (MIXTURE OF EXPERTS) ROUTING CONFIGURATION
# ============================================================================

[system.moe]
# ? Total number of expert networks
# Tab: [8, 16, 32, 64, 128, 243]
# 243 experts enables full 5-trit addressing
total_experts = 243

# ? Number of experts to activate (Top-K)
# Tab: [1, 2, 4, 8]
# Lower values = sparser routing, higher efficiency
active_experts = 4

# ? Number of qutrits for routing decisions
# Tab: [4, 8, 16]
# More qutrits = finer-grained routing granularity
routing_qutrits = 8

# ? Enable load balancing across experts
# Tab: [true, false]
# Prevents expert collapse
load_balancing = true

# ? Load balancing strength (KL divergence weight)
# Tab: [0.01, 0.1, 0.5, 1.0]
# Higher values = more aggressive balancing
load_balance_weight = 0.1

# ? Enable priority-based routing for critical inputs
# Tab: [true, false]
# Allows QoS differentiation
priority_routing = true

# ============================================================================
# FORWARD-FORWARD LEARNING CONFIGURATION
# ============================================================================

[system.learning]
# ? Number of layers in the network
# Tab: [2, 4, 8, 16]
# More layers = deeper representations
num_layers = 4

# ? Neurons per layer
# Tab: [64, 128, 256, 512, 1024]
# Affects model capacity
neurons_per_layer = 256

# ? Learning rate for Hebbian updates
# Tab: [0.001, 0.01, 0.1, 1.0]
# Higher = faster learning but less stable
learning_rate = 0.01

# ? Goodness threshold for positive data
# Tab: [0.5, 1.0, 2.0, 5.0]
# Data with goodness above this is considered "real"
goodness_threshold_pos = 2.0

# ? Goodness threshold for negative data
# Tab: [0.1, 0.5, 1.0]
# Data with goodness below this is considered "fake"
goodness_threshold_neg = 0.5

# ? Use tropical (max-plus) inner product for goodness
# Tab: [true, false]
# True = max-plus semiring, False = standard dot product
tropical_goodness = true

# ============================================================================
# FLASH-CIM (COMPUTE-IN-MEMORY) CONFIGURATION
# ============================================================================

[system.flash_cim]
# ? Storage path for simulated flash
# Tab: ["D:\\flash_cim", ".\\flash_cim", "/tmp/flash_cim"]
# Actual persistence depends on OS permissions
storage_path = "D:\\flash_cim"

# ? Block size in bytes
# Tab: [2048, 4096, 8192]
# Larger blocks = fewer erase cycles
block_size = 4096

# ? Page size in bytes
# Tab: [256, 512, 1024]
# Minimum read/write unit
page_size = 512

# ? Enable error correction codes
# Tab: [true, false]
# Recommended for reliability
enable_ecc = true

# ? Enable wear leveling
# Tab: [true, false]
# Distributes writes evenly across blocks
enable_wear_leveling = true

# ? Maximum program/erase cycles per block
# Tab: [1000, 10000, 100000]
# Flash memory lifetime parameter
max_program_cycles = 10000

# ============================================================================
# WUI (WEB USER INTERFACE) CONFIGURATION
# ============================================================================

[system.wui]
# ? WebSocket server port
# Tab: [8080, 8081, 9000]
# Must be available on the host
websocket_port = 8080

# ? Enable real-time metrics streaming
# Tab: [true, false]
# Updates dashboard at 5 second intervals
realtime_metrics = true

# ? HTTP server port for WUI files
# Tab: [0, 7345, 8765, 9243]
# Set to 0 to disable HTTP server (uses file:// protocol instead)
http_port = 7345

# ? Default theme
# Tab: ["light", "dark", "system"]
# System follows OS preference
theme = "system"

# ? Enable cognitive ergonomics hints
# Tab: [true, false]
# Shows Miller's Law compliance indicators
cognitive_hints = true

# ? Maximum items in activity log
# Tab: [5, 10, 20, 50]
# Miller's Law: 7±2 items
activity_log_size = 10

# ? Auto-save configuration changes
# Tab: [true, false]
# Persists TOML edits immediately
auto_save_config = true

# ============================================================================
# INFERENCE CONFIGURATION (Ternary Qutrit Framework)
# ============================================================================

[system.inference]
# ? Number of qutrits for inference
# Ternary = 3 states per digit (vs 2 for binary)
# Tab: [4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048, 4096]
num_qutrits = 243

# ? Number of MoE experts to activate
# Framework supports up to 243 (5-trit addressing)
# Training already validated with 243 experts
# Tab: [1, 2, 4, 8, 16, 32, 64, 128, 243]
num_experts = 243

# ? Total parameters in model (billions)
# Ternary efficiency: ~10x compression vs 32-bit float
# 100B parameters = ~1TB unified memory at full scale
# Tab: [0.1, 0.5, 1, 5, 10, 50, 100, 500, 1000]
model_size_b = 100

# ? Maximum message passing iterations
# QGNN converges efficiently, can push hard
# Tab: [10, 50, 100, 500, 1000, 5000, 10000, 50000]
max_iterations = 5000

# ? Convergence tolerance
# Stricter precision when needed
# Tab: [0.00001, 0.0001, 0.001, 0.01, 0.1, 1.0]
convergence_tolerance = 0.001

# ? Forward-forward goodness threshold
# Higher values = stricter reality detection
# Tab: [0.1, 0.5, 1.0, 2.0, 5.0, 10.0, 50.0, 100.0]
goodness_threshold = 5.0

# ? Entanglement graph topology
# Scale-free = natural information flow
# Tab: ["linear", "ring", "star", "random", "complete", "scale_free", "small_world", "hierarchical"]
entanglement_graph = "scale_free"

# ? Model checkpoint directory
checkpoint_path = "flash_cim_243expert/checkpoints"

# ? Auto-load model on startup
# "latest" = most recent checkpoint
# "biggest" = largest parameter count
# Tab: ["", "latest", "biggest", "best_goodness", "filename.bin"]
auto_load_model = ""

# ? Enable Betti topology analysis
# Zero overhead when disabled
# Tab: [true, false]
betti_analysis = true

# ? Inference compute device
# Multi-GPU support for large models
# Tab: ["auto", "gpu", "multi_gpu", "cpu", "fpga"]
device = "auto"

# ? Batch size for throughput
# Higher = better GPU utilization
# Tab: [1, 4, 8, 16, 32, 64, 128, 256, 512]
batch_size = 64

# ? USM arena for inference (MB)
# Framework efficiency allows massive models
# 1TB unified memory = 10 trillion parameters
# Tab: [1024, 4096, 8192, 16384, 32768, 65536, 131072, 262144, 524288, 1048576]
arena_mb = 65536

# ? Parallel inference streams
# Saturation for multi-GPU or high batch
# Tab: [1, 2, 4, 8, 16, 32, 64]
parallel_streams = 8

# ? Expert routing temperature
# 0.1 = deterministic, 5.0 = very diverse
# Tab: [0.01, 0.1, 0.5, 1.0, 2.0, 5.0, 10.0]
routing_temperature = 1.0

# ? Load balancing monitoring
# Track expert utilization
# Tab: [true, false]
monitor_expert_balance = true

# ? Inference timeout (seconds)
# 0 = unlimited (research mode)
# Tab: [0, 30, 60, 300, 600, 3600, 7200]
timeout_seconds = 0

# ? Precision mode
# Ternary = native framework precision (most efficient)
# Tab: ["ternary", "fp8", "fp16", "bf16", "fp32"]
precision = "ternary"

# ? Sparsity pattern
# MoE sparse = only active experts computed
# Tab: ["dense", "moe_sparse", "unstructured", "block"]
sparsity = "moe_sparse"

# ? Enable Flash-CIM persistence
# Store inference state in flash
# Tab: [true, false]
flash_persistence = false

# ? Checkpoint compression
# Reduce storage by 100x
# Tab: ["none", "lz4", "zstd", "ternary_pack"]
checkpoint_compression = "ternary_pack"

# ? Automatic mixed precision
# Use fastest precision per layer
# Tab: [true, false]
auto_mixed_precision = true

# ============================================================================
# PIPELINE INTEGRATION CONFIGURATION
# ============================================================================

[system.pipelines]
# ? CI/CD pipeline trigger endpoint
# Tab: ["local", "github", "gitlab"]
# Local = simulate pipelines, github = GitHub Actions
ci_trigger = "github"

# ? GitHub repository for pipeline triggers
# Tab: ["owner/repo"]
# Required if ci_trigger = "github"
github_repo = "kennetholsen/q_mini_wasm_v2"

# ? Enable automatic recompilation on config change
# Tab: [true, false]
# Rebuilds WASM module when TOML modified
auto_recompile = false

# ? Pipeline status polling interval (seconds)
# Tab: [5, 10, 30, 60]
polling_interval = 10

# ============================================================================
# LOGGING AND DEBUGGING
# ============================================================================

[system.logging]
# ? Log level
# Tab: [0, 1, 2, 3]
# 0=error, 1=warning, 2=info, 3=debug
log_level = 2

# ? Log file path
# Tab: ["logs/q_mini_wasm_v2.log", "/var/log/q_mini_wasm_v2.log"]
log_file = "logs/q_mini_wasm_v2.log"

# ? Enable quantum state validation
# Tab: [true, false]
# Checks stabilizer tableau validity (performance impact)
validate_quantum_states = false

# ? Enable memory leak detection
# Tab: [true, false]
# Tracks arena allocations (debug builds only)
detect_memory_leaks = true

# ============================================================================
# ADVANCED / EXPERIMENTAL FEATURES
# ============================================================================

[system.experimental]
# ? Enable Betti number topology analysis
# Tab: [true, false]
# Advanced quantum error correction (research feature)
betti_analysis = false

# ? Enable distributed multi-node execution
# Tab: [true, false]
# Requires network configuration
distributed_execution = false

# ? Enable Flash-CIM hardware acceleration
# Tab: [true, false]
# Uses actual flash devices (if available)
flash_cim_hardware = false
