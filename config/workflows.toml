# Cline Workflows Configuration
# Data format priority: gRPC > TOML > JSON

[project]
name = "q_mini_wasm_v2"

# ============================================================================
# CLINE WORKFLOWS
# ============================================================================

[cline_workflows.feature_development]
description = "Complete feature development lifecycle"
steps = [
  "analyze_requirements",
  "plan_implementation",
  "create_or_modify_files",
  "run_tests",
  "verify_changes",
  "attempt_completion"
]
tool_sequence = [
  "read_file -> understand_context",
  "list_files -> understand_structure",
  "write_to_file or replace_in_file -> implement",
  "execute_command -> test",
  "attempt_completion -> present_result"
]
branch_naming = "feature/{module}-{description}"

[cline_workflows.feature_development.pr_requirements]
code_review = "required"
test_coverage = ">=80%"
documentation_update = "required_for_api_changes"

[cline_workflows.bug_fix]
description = "Bug identification and resolution workflow"
steps = [
  "reproduce_bug",
  "identify_root_cause",
  "implement_fix",
  "run_regression_tests",
  "verify_fix",
  "attempt_completion"
]
tool_sequence = [
  "search_files -> find_related_code",
  "read_file -> understand_issue",
  "replace_in_file -> apply_fix",
  "execute_command -> run_tests",
  "attempt_completion -> present_result"
]
branch_naming = "fix/{module}-{issue}"
required_checks = ["regression_tests", "unit_tests", "integration_tests"]

[cline_workflows.refactoring]
description = "Code refactoring workflow"
steps = [
  "analyze_current_structure",
  "plan_refactoring",
  "apply_changes_incrementally",
  "verify_no_regressions",
  "update_documentation",
  "attempt_completion"
]
tool_sequence = [
  "list_code_definition_names -> understand_structure",
  "search_files -> find_all_usages",
  "replace_in_file -> apply_changes",
  "execute_command -> verify",
  "attempt_completion -> present_result"
]

[cline_workflows.refactoring.rules]
prefer_replace_in_file = true
apply_changes_in_order = true
verify_after_each_change = true

[cline_workflows.multi_file_edit]
description = "Coordinated edits across multiple files"
steps = [
  "plan_all_changes",
  "read_all_relevant_files",
  "apply_changes_sequentially",
  "verify_consistency",
  "attempt_completion"
]
tool_sequence = [
  "search_files -> find_all_affected_files",
  "read_file -> understand_each_file",
  "replace_in_file -> apply_each_change",
  "execute_command -> verify",
  "attempt_completion -> present_result"
]

[cline_workflows.multi_file_edit.rules]
one_file_at_a_time = true
wait_for_confirmation_between_files = true
update_references_across_files = true

[cline_workflows.documentation_generation]
description = "Generate and update documentation"
steps = [
  "analyze_code_structure",
  "extract_documentation",
  "format_according_to_standards",
  "verify_completeness",
  "attempt_completion"
]
tool_sequence = [
  "read_file -> understand_code",
  "list_code_definition_names -> find_public_apis",
  "write_to_file -> generate_docs",
  "attempt_completion -> present_result"
]

[cline_workflows.testing_workflow]
description = "Test creation and execution workflow"
steps = [
  "analyze_code_to_test",
  "identify_test_cases",
  "create_or_update_tests",
  "run_test_suite",
  "verify_coverage",
  "attempt_completion"
]
tool_sequence = [
  "read_file -> understand_code",
  "search_files -> find_existing_tests",
  "write_to_file or replace_in_file -> update_tests",
  "execute_command -> run_tests",
  "attempt_completion -> present_result"
]

# ============================================================================
# DEVELOPMENT WORKFLOWS
# ============================================================================

[development_workflows.feature_development]
branch_naming = "feature/{module}-{description}"
required_modules = ["core", "tests"]
pre_commit_checks = ["clang_format_check", "trit_operation_validation", "stabilizer_correctness_check"]

[development_workflows.feature_development.pr_requirements]
code_review = "required"
quantum_expert_review = "recommended_for_core_changes"
test_coverage = ">=80%"
documentation_update = "required_for_api_changes"

[development_workflows.bug_fix]
branch_naming = "fix/{module}-{issue}"
required_checks = ["regression_tests", "quantum_correctness_validation", "gf3_arithmetic_verification"]

[development_workflows.quantum_algorithm_change]
branch_naming = "quantum/{algorithm}-{description}"

[development_workflows.quantum_algorithm_change.special_requirements]
research_document_reference = "mandatory"
tableau_correctness_proof = "required"
energy_efficiency_analysis = "recommended"
expert_review = "required"

# ============================================================================
# BUILD WORKFLOWS
# ============================================================================

[build_workflows.cpp_build]

[build_workflows.cpp_build.cmake_config]
build_types = ["Debug", "Release", "RelWithDebInfo"]

[build_workflows.cpp_build.cmake_config.options]
USE_SYCL = "optional"
BUILD_TESTS = "required"
BUILD_WASM = "optional"

[build_workflows.cpp_build.platforms.windows]
generator = "Visual Studio 17 2022"
compiler = "msvc"

[build_workflows.cpp_build.platforms.linux]
generator = "Unix Makefiles"
compiler = "gcc_or_clang"

[build_workflows.cpp_build.build_commands.unix]
configure = "cmake -S q_mini_wasm_v2 -B build -DCMAKE_BUILD_TYPE={build_type} -DBUILD_TESTS=ON"
build = "cmake --build build --config {build_type} -j$(nproc)"
test = "ctest --build-config {build_type} --output-on-failure"

[build_workflows.cpp_build.build_commands.powershell]
configure = "cmake -S q_mini_wasm_v2 -B build -DCMAKE_BUILD_TYPE={build_type} -DBUILD_TESTS=ON"
build = "cmake --build build --config {build_type} -j$env:NUMBER_OF_PROCESSORS"
test = "ctest --build-config {build_type} --output-on-failure"

[build_workflows.go_build]
modules = ["gateway", "engine"]

[build_workflows.go_build.build_commands]
build = "go build -o bin/gateway.exe ./cmd/gateway"
test = "go test -v -race ./..."
lint = "golangci-lint run"

[build_workflows.go_build.cgo_requirements]
header = "q_mini_wasm_v2/dll/q_mini_wasm_v2_api.hpp"
link_flags = "-lq_mini_wasm_v2_core"

[build_workflows.wasm_build]
toolchain = "emscripten"

[build_workflows.wasm_build.build_commands]
configure = "emcmake cmake -S q_mini_wasm_v2 -B wasm_build -DBUILD_WASM=ON"
build = "cmake --build wasm_build"
optimize = "wasm-opt -O3 -o output.wasm input.wasm"

[build_workflows.python_build.build_commands]
install = "pip install -e ."
test = "pytest tests/ -v"
lint = "ruff check ."
format = "black ."

# ============================================================================
# CI/CD WORKFLOWS
# ============================================================================

[ci_cd_workflows.continuous_integration]
trigger = "push_to_main_or_develop"

[[ci_cd_workflows.continuous_integration.jobs]]
name = "lint"
steps = ["clang_format", "static_analysis"]

[[ci_cd_workflows.continuous_integration.jobs]]
name = "build_matrix"
platforms = ["windows-latest", "ubuntu-latest"]
configurations = ["Debug", "Release"]

[[ci_cd_workflows.continuous_integration.jobs]]
name = "test"
requires = "build_matrix"
steps = ["unit_tests", "integration_tests"]

[[ci_cd_workflows.continuous_integration.jobs]]
name = "sycl_build"
optional = true
steps = ["check_sycl_availability", "build_with_sycl", "test_sycl"]

[ci_cd_workflows.release_workflow]
trigger = "tag_push_v*"

[[ci_cd_workflows.release_workflow.jobs]]
name = "build_release"
steps = ["build_native", "generate_sbom", "create_tarball"]

[[ci_cd_workflows.release_workflow.jobs]]
name = "create_github_release"
requires = "build_release"
artifacts = ["*.tar.gz", "sbom-spdx.json"]

# ============================================================================
# QUANTUM SPECIFIC WORKFLOWS
# ============================================================================

[quantum_specific_workflows.tableau_validation]
description = "Validate qutrit stabilizer tableau correctness"
steps = [
  "compile_with_debug_symbols",
  "run_stabilizer_tests",
  "verify_clifford_operations",
  "check_gottesman_knill_compliance",
  "generate_correctness_report"
]

[quantum_specific_workflows.energy_efficiency_analysis]
description = "Analyze energy consumption of quantum operations"
metrics = ["picojoules_per_operation", "comparison_to_fp32", "sycl_acceleration_factor"]

# ============================================================================
# MCP ORCHESTRATION WORKFLOWS
# ============================================================================

[mcp_orchestration_workflows.multi_server_coordination]
description = "Coordinate tasks across multiple MCP servers"
steps = [
  "identify_required_servers",
  "check_server_availability",
  "execute_tools_sequentially",
  "aggregate_results",
  "present_unified_output"
]
servers = ["qminiwasm-core", "qminiwasm-cpp-programming", "qminiwasm-python-programming", "qminiwasm-security"]

[mcp_orchestration_workflows.research_and_implement]
description = "Research documentation then implement changes"
steps = ["search_docs", "read_relevant_files", "plan_implementation", "apply_changes", "verify_with_tests"]