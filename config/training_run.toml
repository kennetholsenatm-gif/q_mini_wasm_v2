# Training configuration for book dataset run
# Generated for training on Gutenberg corpus

[training]
epochs = 3
batch_size = 32
learning_rate = 0.001
learning_rate_shift = 0.1
num_workers = 4
max_seq_length = 512
gradient_accumulation_steps = 4
save_every_n_steps = 500
log_interval = 100

[model]
num_experts = 4
num_layers = 2
neurons_per_layer = 128
routing_qutrits = 8
dropout_rate = 0.1

[features]
use_wasm = false
# Native q_mini_wasm_v2 / q_training is always built with SYCL (no CMake toggle).
use_sycl = true
use_sse = true

[dataset]
path = 'C:\\q_mini_data\\datasets\\gutenberg_corpus.jsonl'
format = 'jsonl'
trit_dim = 20
max_samples = 10000

[paths]
dataset_dir = 'C:\\q_mini_data\\datasets'
checkpoint_dir = 'C:\\q_mini_data\\checkpoints'
weights_dir = 'C:\\q_mini_data\\weights'
logs_dir = 'C:\\q_mini_data\\logs'
