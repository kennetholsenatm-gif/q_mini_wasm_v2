# Heavier smoke / benchmark preset for a single machine (Iris Xe class + plenty of RAM).
# Use:  $env:QMINI_TRAINING_CONFIG = "...\training_config.throughput_smoke.toml"
# Or:   .\scripts\prove_training_works.ps1 -Config "config\training_config.throughput_smoke.toml"
# Not for minimal CI — larger MoE + batches than training_config.proof.toml.

[training]
epochs = 5
batch_size = 4096
checkpoint_interval = 2
learning_rate = 1
buffer_profile = "aggressive"
samples_per_epoch = 500000
micro_batch_cap = 4096
collect_floor = 2048
timing_to_stderr = true
sycl_route_mode = "auto"
sycl_trit_quant_min_moe_dim = 128
sycl_prereserve_gib = 0
sycl_gpu_device_index = -1
gf3_sycl_min_weight_cells = 0
ff_multi_row_batch = true
ff_multi_row_slots_chunk = 4096
lazy_moe_resident_cap = 0
goodness_log_level = 0
allow_generated_negatives = true
prefill_target_samples = 32768
prefill_timeout_ms = 120000
prefill_poll_ms = 2
acq_queue_cap = 49152
raw_queue_cap = 49152
train_queue_cap = 98304
acquisition_threads = 16
perturbation_threads = 16
checkpoint_async_queue_max = 64
collect_empty_backoff_base_ms = 2
collect_empty_backoff_max_shift = 8
collect_empty_backoff_cap_ms = 96
metrics_heartbeat_sec = 4
max_jsonl_local_samples = 500000
lazy_init_initial_experts = 256
parallel_contrastive_rows = true
ff_expert_chunk_size = 32
target_routes_per_batch = 65536
collect_window_ms = 150
collect_min_rows_per_batch = 32

[training.data_filter]
min_text_length = 10
max_text_length = 100000
checkpoint_interval_samples = 250000
directory_max_lines = 100000

[model]
moe_experts = 512
moe_top_k = 16
context_window = 256
entanglement_tokens = 32
shadow_dim = 64
num_layers = 4
neurons_per_layer = 128
routing_qutrits = 8
moe_input_dim = 128
moe_output_dim = 128
moe_hidden_dim = 192
expert_internal_layers = 1
moe_ff_active_internal_layers = 1
learning_rate_shift = 0

[features]
steane_correction = false
flash_cim = false
worker_threads = 16
continuous_mode = false
lazy_init = true
data_accumulation = false

[apis]
enabled = false
wolfram = false
pubchem = false
wikidata = false
arxiv = false
nasa = false
pdb = false
github = false
lean = false

[streaming]
enabled = true
port = 9090

[paths]
base_model = "checkpoints/final_model.json"
output_dir = "checkpoints/"
dataset_dir = "datasets/proof_corpus"
