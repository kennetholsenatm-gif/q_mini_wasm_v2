# Fast path for verifying that samples/epochs advance (use with QMINI_TRAINING_CONFIG).
# Example (PowerShell): see scripts/run_qminiwasm_training_verbose.ps1 -Smoke
#
# Smaller batch micro-collect, lower top_k, no Steane — far fewer expert updates per batch
# than production [config/training_config.toml].

[training]
epochs = 10
batch_size = 256
checkpoint_interval = 10
learning_rate = 10
buffer_profile = "balanced"
samples_per_epoch = 1280
micro_batch_cap = 256
collect_floor = 1
timing_to_stderr = false
sycl_route_mode = "auto"
sycl_trit_quant_min_moe_dim = 128
sycl_prereserve_gib = 0
sycl_gpu_device_index = -1
gf3_sycl_min_weight_cells = 0
ff_multi_row_batch = true
ff_multi_row_slots_chunk = 0
lazy_moe_resident_cap = 0
goodness_log_level = 0
allow_generated_negatives = true
prefill_target_samples = 512
prefill_timeout_ms = 60000
prefill_poll_ms = 50
acq_queue_cap = 8192
raw_queue_cap = 8192
train_queue_cap = 16384
acquisition_threads = 4
perturbation_threads = 4
checkpoint_async_queue_max = 24
collect_empty_backoff_base_ms = 10
collect_empty_backoff_max_shift = 10
collect_empty_backoff_cap_ms = 1000
metrics_heartbeat_sec = 2
max_jsonl_local_samples = 50000
lazy_init_initial_experts = 16
checkpoint_data_dir = "C:/q_mini_data"

[training.data_filter]
min_text_length = 50
max_text_length = 100000
checkpoint_interval_samples = 500
directory_max_lines = 500000

[model]
moe_experts = 8192
moe_top_k = 8
context_window = 8192
entanglement_tokens = 1024
shadow_dim = 4096
num_layers = 64
neurons_per_layer = 2048
routing_qutrits = 12
moe_input_dim = 2048
moe_output_dim = 2048
moe_hidden_dim = 4096
expert_internal_layers = 2
moe_ff_active_internal_layers = 0
learning_rate_shift = 2

[features]
steane_correction = false
flash_cim = false
worker_threads = 8
continuous_mode = false
lazy_init = true
data_accumulation = true

[apis]
enabled = false
wolfram = false
pubchem = false
oeis = false
wikidata = false
arxiv = false
nasa = false
pdb = false
github = false
lean = false

[streaming]
enabled = true
port = 9090

[paths]
base_model = "checkpoints/final_model.json"
output_dir = "checkpoints/"
dataset_dir = "datasets/"
