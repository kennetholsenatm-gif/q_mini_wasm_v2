# =============================================================================
# Frontier profile (~48 GB RAM envelope) — ratio notes
# - Queues: acq : raw : train = 1 : 1 : 2 (staging). Slightly below prior 32k/32k/64k to
#   budget headroom for wider GF(3) tensors + more materialized experts while staying
#   inside ~48 GB when raw/train items hold text payloads (trim acq/raw/train first if RSS spikes).
# - Prefill: target ≈ 3/7 of raw cap so prefill completes before raw is chronically full.
# - samples_per_epoch: 3 × train_queue_cap = one epoch ~= three full train-buffer turnovers at cap.
# - Widths: neurons = moe_in = moe_out; shadow_dim = 2×neurons; moe_hidden ≈ 8/3×neurons (~2.67×).
# - MoE: 8192 experts — autonomous_training_pipeline adaptive guardrails force effective
#   collect_limit≈1 and effective top_k≈1 at this expert count (router work ~ E×qutrits).
#   moe_top_k here stays 128 as the logical/router config; per-route FF parallelism stays bounded.
# =============================================================================
[training]
epochs = 120
batch_size = 32768
checkpoint_interval = 10
learning_rate = 10
buffer_profile = "aggressive"
# Route-units per epoch (native q_training); see q_mini_docs/TRAINING_THROUGHPUT.md.
samples_per_epoch = 172032
micro_batch_cap = 4096
collect_floor = 1
timing_to_stderr = false
serial_expert_train = false
# Symplectic MoE routing logits: auto (SYCL when USE_SYCL and expert count high), on, or off — see q_mini_docs/TRAINING_THROUGHPUT.md.
sycl_route_mode = "auto"
# Minimum model.moe_input_dim to run SYCL float/int32/string -> trit quantization (below = CPU path).
sycl_trit_quant_min_moe_dim = 128
# 0=no extra stderr; 1=batch FF goodness summary; 2=+ first contrastive rows (see q_training Training_InitSession).
goodness_log_level = 0
allow_generated_negatives = true
# DataSynthesizer / prefill — explicit integers (qminiwasm rejects missing keys).
prefill_target_samples = 12288
prefill_timeout_ms = 180000
prefill_poll_ms = 40
acq_queue_cap = 28672
raw_queue_cap = 28672
train_queue_cap = 57344
# When features.lazy_init is true, pipeline starts with this many materialized experts (<= moe_experts).
lazy_init_initial_experts = 96

[model]
moe_experts = 8192
moe_top_k = 128
context_window = 12288
entanglement_tokens = 1536
shadow_dim = 6144
num_layers = 80
neurons_per_layer = 3072
routing_qutrits = 12
moe_input_dim = 3072
moe_output_dim = 3072
moe_hidden_dim = 8192
expert_internal_layers = 3
# Cap FF stack depth inside each materialized expert (0 = no cap; use min with expert_internal_layers when > 0).
moe_ff_active_internal_layers = 0
learning_rate_shift = 2

[features]
steane_correction = true
flash_cim = false
worker_threads = 48
continuous_mode = true
lazy_init = true
data_accumulation = true

[apis]
enabled = false
wolfram = false
pubchem = false
oeis = false
wikidata = false
arxiv = false
nasa = false
pdb = false
github = false
lean = false

[streaming]
enabled = true
port = 9090

[paths]
# =============================================================================
# DATA PATHS - Configure for your environment
# =============================================================================
# For git-appropriate repositories, use external data storage:
#   Windows: C:\q_mini_data\ or D:\ML_Data\q_mini\
#   Linux:   /var/lib/q_mini/data/ or ~/q_mini_data/
#   macOS:   ~/Library/Application Support/q_mini/data/
#
# Run: .\scripts\setup_external_data.ps1 to migrate data outside git
# =============================================================================

base_model = "checkpoints/final_model.json"
output_dir = "checkpoints/"

# Dataset directory - can be external (outside git repo)
# Default: relative "datasets/" for local testing
# Production: "C:\\q_mini_data\\datasets" or "/var/lib/q_mini/datasets"
dataset_dir = "datasets/"

# External data paths (uncomment and set for production)
# external_data_root = "C:\\q_mini_data"
# weights_dir = "C:\\q_mini_data\\weights"
# logs_dir = "C:\\q_mini_data\\logs"

# =============================================================================
# Previously Hardcoded Values - Now Configurable
# =============================================================================

[model.expert]
sparsity = 0.05              # Tropical sparse edge density (5%)
neurons_per_layer = 3072   # Experts: neurons per layer (match [model].neurons_per_layer)
learning_rate_shift = 2    # Fixed-point learning rate shift

[som]
initial_experts = 2              # Seed experts to start with
split_beta1_threshold = 5        # Split when β₁ > 5 cycles detected
target_graph_density = 0.15      # 15% connectivity (sparse but connected)
min_graph_density = 0.05         # Below 5% = too sparse, add edges
max_graph_density = 0.40         # Above 40% = too dense, remove edges
max_experts_hard_cap = 100000    # Safety cap for expert count
merge_min_activation_rate = 0.001 # Merge experts with < 0.1% activation

[graph]
initial_nodes = 64   # Initial graph topology nodes
initial_edges = 112  # Initial graph topology edges (tree-like + cycles)

[training.data_filter]
min_text_length = 50      # Minimum text length for training samples
max_text_length = 100000  # Maximum text length for training samples
checkpoint_interval_samples = 500  # Checkpoint every N samples

[network]
http_timeout_ms = 30000  # HTTP request timeout
https_port = 443         # Default HTTPS port
routing_qutrits = 8      # Qutrits for MoE routing

[apis.limits]
rate_limit_daily = 100000  # API calls per day limit
backoff_ms = 100           # Initial backoff between retries
http_timeout_ms = 5000     # API HTTP timeout

[sycl]
work_group_size = 256   # SYCL kernel work group size
local_mem_nodes = 32    # SYCL local memory nodes

[flash_cim]
num_blocks = 1024              # Simulated Flash-CIM blocks
energy_fixed_point_scale = 1000000  # Fixed-point energy calculation scale

[memory]
arena_mb = 2048  # Memory arena size in MB (frontier host; still small vs 48 GB process budget)

[bridge]
mcp_timeout_ms = 15000  # MCP request timeout

[data_sources]
urls = [
    "arxiv.org/abs/quant-ph",
    "mathworld.wolfram.com",
    "oeis.org",
    "datasets-server.huggingface.co",
    "huggingface.co/datasets/bigcode/the-stack",
    "ebi.ac.uk/chembl",
    "materialsproject.org",
    "dbpedia.org",
    "yago-knowledge.org",
    "ensembl.org",
    "dbpedia.org",
    "yago-knowledge.org",
    "ensembl.org",
    "gamma.sympy.org",
    "github.com/leanprover-community/mathlib4",
    "arxiv.org",
    "wolframalpha.com",
    "wikidata.org",
    "pubchem.ncbi.nlm.nih.gov",
    "rcsb.org",
    "oeis.org",
    "export.arxiv.org",
    "query.wikidata.org",
    "oeis.org",
    "api.openalex.org",
    "gutendex.com",
    "earthquake.usgs.gov",
    "api.spacexdata.com",
    "chroniclingamerica.loc.gov",
    "api.gbif.org",
    "data/wikipedia_math",
    "data/stackexchange_physics"
]
recursive = true
max_depth = 5
max_pages_per_source = 50000
