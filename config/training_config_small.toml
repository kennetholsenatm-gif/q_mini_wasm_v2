# Small profile for local iteration — every key required by qminiwasm is explicit (no host defaults).

[training]
epochs = 10
batch_size = 256
checkpoint_interval = 5
learning_rate = 10
buffer_profile = "balanced"
samples_per_epoch = 1280
micro_batch_cap = 256
collect_floor = 1
timing_to_stderr = false
serial_expert_train = false
sycl_route_mode = "auto"
sycl_trit_quant_min_moe_dim = 128
goodness_log_level = 0
allow_generated_negatives = true
prefill_target_samples = 512
prefill_timeout_ms = 60000
prefill_poll_ms = 50
acq_queue_cap = 8192
raw_queue_cap = 8192
train_queue_cap = 16384
lazy_init_initial_experts = 8

[model]
moe_experts = 8
moe_top_k = 4
context_window = 512
entanglement_tokens = 64
shadow_dim = 256
num_layers = 4
neurons_per_layer = 128
routing_qutrits = 8
moe_input_dim = 128
moe_output_dim = 128
moe_hidden_dim = 256
expert_internal_layers = 2
moe_ff_active_internal_layers = 0
learning_rate_shift = 2

[features]
steane_correction = true
flash_cim = false
worker_threads = 4
continuous_mode = false
lazy_init = true
data_accumulation = true

[apis]
enabled = true
wolfram = false
pubchem = true
oeis = true
wikidata = false
arxiv = false
nasa = true
pdb = true
github = false
lean = false

[streaming]
enabled = true
port = 9090

[paths]
base_model = "checkpoints/final_model.json"
output_dir = "checkpoints/"
dataset_dir = "datasets/"

[data_sources]
urls = [
    "oeis.org",
    "datasets-server.huggingface.co"
]
