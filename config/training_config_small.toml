# Small profile for local iteration — every key required by qminiwasm is explicit (no host defaults).

[training]
epochs = 10
batch_size = 256
checkpoint_interval = 5
learning_rate = 10
buffer_profile = "balanced"
samples_per_epoch = 1280
micro_batch_cap = 256
collect_floor = 1
timing_to_stderr = false
sycl_route_mode = "auto"
sycl_trit_quant_min_moe_dim = 128
sycl_prereserve_gib = 0
sycl_gpu_device_index = -1
gf3_sycl_min_weight_cells = 0
ff_multi_row_batch = true
ff_multi_row_slots_chunk = 0
lazy_moe_resident_cap = 0
goodness_log_level = 0
allow_generated_negatives = true
prefill_target_samples = 512
prefill_timeout_ms = 60000
prefill_poll_ms = 50
acq_queue_cap = 8192
raw_queue_cap = 8192
train_queue_cap = 16384
acquisition_threads = 2
perturbation_threads = 4
checkpoint_async_queue_max = 24
collect_empty_backoff_base_ms = 10
collect_empty_backoff_max_shift = 10
collect_empty_backoff_cap_ms = 1000
metrics_heartbeat_sec = 2
max_jsonl_local_samples = 100000
lazy_init_initial_experts = 8

[training.data_filter]
min_text_length = 50
max_text_length = 10000
checkpoint_interval_samples = 500
directory_max_lines = 1000000

[model]
moe_experts = 8
moe_top_k = 4
context_window = 512
entanglement_tokens = 64
shadow_dim = 256
num_layers = 4
neurons_per_layer = 128
routing_qutrits = 8
moe_input_dim = 128
moe_output_dim = 128
moe_hidden_dim = 256
expert_internal_layers = 2
moe_ff_active_internal_layers = 0
learning_rate_shift = 2

[features]
steane_correction = true
flash_cim = false
worker_threads = 4
continuous_mode = false
lazy_init = true
data_accumulation = true

[apis]
enabled = true
wolfram = false
pubchem = true
oeis = true
wikidata = false
arxiv = false
nasa = true
pdb = true
github = false
lean = false

[streaming]
enabled = true
port = 9090

[paths]
base_model = "checkpoints/final_model.json"
output_dir = "checkpoints/"
dataset_dir = "datasets/"

[data_sources]
urls = [
    "oeis.org",
    "datasets-server.huggingface.co"
]
