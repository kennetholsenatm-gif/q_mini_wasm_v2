[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

# PEP 621 metadata required by setuptools when building editable installs from pyproject.toml.
# Detailed metadata and extras remain in setup.py for now.
[project]
name = "llm-pract"
version = "0.1.0"
description = "Q-Mini-WASM: ternary-quantized models with local WASM execution"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "torch>=2.0.0",
    "pennylane>=0.28",
    "wasmtime>=14.0.0",
    "pywasm>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "cryptography>=46.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "bandit>=1.7",
    "black>=23.7.0",
    "flake8>=6.0.0",
    "mypy>=1.4.0",
    "mkdocs>=1.5.0",
    "mkdocs-material>=9.0.0",
]
serve = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
]
wasm = [
    "wasmtime>=14.0.0",
    "pywasm>=2.0.0",
]
gpu = ["dpctl>=0.15.0"]
arc = ["dpctl>=0.15.0"]
native = [
    "pybind11>=2.11.0",
]
scripts = [
    "click>=8.1.0",
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
]
security = [
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pip-audit>=2.6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["qminiwasm*"]

[tool.bandit]
exclude_dirs = ["tests", "venv", ".venv", "build", "dist"]
skips = [
  "B101",   # assert_used allowed in test code
  "B311",   # random: used for synthetic data/fault injection only, not crypto
  "B404",   # subprocess import: wasm engine uses it for compiler invocation
  "B603",   # subprocess without shell: engine runs fixed compiler with controlled args
]

[tool.black]
line-length = 100
target-version = ["py311"]
include = '\.pyi?$'
extend-exclude = '''/(\\.eggs|\\.git|\\.hg|\\.mypy_cache|\\.tox|\\.venv|build|dist)/'''

[tool.flake8]
max-line-length = 100
extend-ignore = ["E203", "W503"]
exclude = [".git", "__pycache__", "build", "dist", ".venv"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["tests/", "build/"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
python_files = ["test_*.py"]
python_functions = ["test_*"]
markers = [
    "integration: marks tests as integration (deselect with '-m \"not integration\"')",
]
