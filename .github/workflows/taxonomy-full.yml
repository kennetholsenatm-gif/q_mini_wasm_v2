# Full-tree Edge AI taxonomy scan (legacy lexicon) — complements diff-only PR gates.
# Policy: PR/push uses scripts/taxonomy_linter.py --diff-base; this workflow enforces
# prose/code conformance on the full configured tree on a schedule and on demand.
name: Taxonomy full scan

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  taxonomy-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Full taxonomy lint
        run: python3 scripts/taxonomy_linter.py --full
