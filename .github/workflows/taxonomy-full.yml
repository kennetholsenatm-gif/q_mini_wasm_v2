# Full-tree Edge AI taxonomy scan (legacy lexicon) — complements diff-only PR gates.
# Policy: PR/push uses training-wui/cmd/qmw-taxonomy-linter --diff-base; this workflow enforces
# prose/code conformance on the full configured tree on a schedule and on demand.
name: Taxonomy full scan

permissions:
  contents: read

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:00 UTC
    - cron: "0 6 * * 1"

jobs:
  taxonomy-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Full taxonomy lint
        run: cd training-wui && go run ./cmd/qmw-taxonomy-linter --root .. --config ../configs/ci/taxonomy_linter.json --full
