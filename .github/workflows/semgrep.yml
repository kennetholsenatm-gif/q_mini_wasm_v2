# See https://semgrep.dev/docs

name: Semgrep

on:
  push:
    branches: [main]
  pull_request:
    branches:
      - main
      - "pr/**"
  schedule:
    - cron: "37 16 * * 4"

permissions:
  contents: read

jobs:
  semgrep:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    name: Scan
    runs-on: ubuntu-latest
    steps:
      # Checkout project source
      - uses: actions/checkout@v6

      # Host-installed Semgrep (avoids Docker Hub pulls from legacy semgrep-action agent image).
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (Semgrep Code / App)
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
          SEMGREP_DEPLOYMENT_ID: ${{ secrets.SEMGREP_DEPLOYMENT_ID }}
        run: semgrep ci --sarif --sarif-output semgrep.sarif

      # Upload SARIF file generated in previous step
      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('semgrep.sarif') != ''
        with:
          sarif_file: semgrep.sarif
