name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release
  CMAKE_GENERATOR: "Visual Studio 17 2022"

jobs:
  # ===========================================================================
  # GF(3) VALIDATION - Quantum Simulability Checks
  # ===========================================================================
  gf3-validation:
    name: GF(3) Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Run GF(3) Validation
        run: |
          python scripts/validate_gf3.py q_mini_wasm_v2/core --recursive --completeness --energy --output gf3_report.txt
          
      - name: Run Energy Efficiency Tests
        run: |
          python scripts/energy_efficiency_test.py q_mini_wasm_v2/core --output energy_report.txt
          
      - name: Upload Validation Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gf3-validation-reports
          path: |
            gf3_report.txt
            energy_report.txt
          retention-days: 30

  # ===========================================================================
  # LINT & STATIC ANALYSIS
  # ===========================================================================
  lint:
    name: Lint & Format
    needs: gf3-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Policy — no sycl_route_mode Off regression
        run: python scripts/check_no_sycl_route_off.py .

      - name: Policy — no hidden throughput / multislot caps
        run: python scripts/check_no_throughput_hidden_caps.py .

      - name: Check C++ formatting
        run: |
          sudo apt-get install -y clang-format
          find q_mini_wasm_v2 -name "*.hpp" -o -name "*.cpp" | head -20
          # Format check (non-blocking initially)
          find q_mini_wasm_v2 -name "*.hpp" -o -name "*.cpp" \
            -exec clang-format --dry-run --Werror {} \; || echo "::warning::Format issues found"

  # ===========================================================================
  # NATIVE BUILD + TEST (Linux + Intel oneAPI DPC++; SYCL is mandatory in CMake)
  # ===========================================================================
  build:
    name: Native SYCL (${{ matrix.build_type }})
    needs: [gf3-validation, lint]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build_type: [Release, Debug]

    steps:
      - uses: actions/checkout@v4

      - name: Install Intel oneAPI DPC++ compiler
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --yes --dearmor --output /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y ninja-build intel-oneapi-compiler-dpcpp-cpp
        shell: bash

      - name: Configure CMake (icpx)
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S q_mini_wasm_v2 -B q_mini_wasm_v2/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_C_COMPILER=icx \
            -DBUILD_TESTS=ON
        shell: bash

      - name: Build
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake --build q_mini_wasm_v2/build -j$(nproc)
        shell: bash

      - name: Run tests
        run: |
          source /opt/intel/oneapi/setvars.sh
          cd q_mini_wasm_v2/build && ctest --output-on-failure --timeout 120
        shell: bash

      - name: Post-build GF(3) Validation
        run: |
          python scripts/ci_gf3_check.py
        shell: bash

      - name: Upload build artifacts
        if: matrix.build_type == 'Release'
        uses: actions/upload-artifact@v4
        with:
          name: build-ubuntu-sycl-${{ matrix.build_type }}
          path: |
            q_mini_wasm_v2/build/**/q_mini_wasm_v2_core.*
            q_mini_wasm_v2/build/**/q_mini_wasm_v2_tests*
            q_mini_wasm_v2/build/**/q_mini_wasm_v2_network_test*
          retention-days: 7