# DevSecOps CI: lint, test, SAST, dependency scan
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Run manually from Actions tab

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Black
        run: black --check qminiwasm/ tests/

      - name: Flake8
        run: flake8 qminiwasm/ tests/ --max-line-length=100 --extend-ignore=E203,W503

      - name: MyPy
        run: mypy qminiwasm/ --ignore-missing-imports || true

      - name: Unit tests
        run: pytest tests/ -v --cov=qminiwasm --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps for scanning
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt bandit pip-audit

      - name: Bandit (SAST)
        run: bandit -r qminiwasm/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: pip-audit (dependency scan)
        run: pip-audit -o pip-audit-report.json -f json 2>/dev/null || pip-audit

      - name: Semgrep (optional)
        run: pip install semgrep && semgrep scan --config=auto qminiwasm/ --json -o semgrep-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json
