# DevSecOps CI: lint, test, SAST, dependency scan — AlmaLinux/RHEL focused
# Version: 3 — lint/test/SAST run in AlmaLinux 9; image jobs build AlmaLinux-based images (GH has no AlmaLinux runners).
name: CI

permissions:
  contents: read
  security-events: write  # required for upload-sarif (Trivy SARIF to Security tab)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  # Lint and test run inside AlmaLinux 9 (project standard; GH has no AlmaLinux runners).
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - name: CI version (confirm this is v3, AlmaLinux-focused)
        run: echo "CI workflow v3 | AlmaLinux-focused | sha=${{ github.sha }} | ref=${{ github.ref }}"

      - name: Lint and test in AlmaLinux 9
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace -e PIP_NO_CACHE_DIR=1 \
            almalinux:9.7-20260129 bash -c '
            set -e
            dnf install -y python3.11 python3.11-pip 2>/dev/null || true
            python3.11 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install black flake8 mypy pytest pytest-cov pypatch==1.0.2
            pip install -r requirements/ci.txt 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
            # Only pass wui/backend when it has .py files (Dockerfile-only tree is skipped; avoids black "path does not exist").
            BLACK_TARGETS=(qminiwasm/ tests/ engine/)
            FLAKE_TARGETS=(qminiwasm/ tests/ engine/)
            if [ -d wui/backend ] && [ -n "$(find wui/backend -type f -name "*.py" -print -quit 2>/dev/null)" ]; then
              BLACK_TARGETS+=(wui/backend/)
              FLAKE_TARGETS+=(wui/backend/)
            fi
            black --check "${BLACK_TARGETS[@]}"
            flake8 "${FLAKE_TARGETS[@]}" --max-line-length=100 --extend-ignore=E203,W503
            # qminiwasm/: full mypy. engine/: black/flake8 above; engine mypy deferred (config typing gaps).
            mypy qminiwasm/ --ignore-missing-imports
            pytest tests/ -v --cov=qminiwasm --cov=engine --cov-report=xml --cov-report=term
            '

      - name: Ensure coverage.xml exists
        run: echo '<coverage></coverage>' > "$GITHUB_WORKSPACE/coverage.xml"
        continue-on-error: true

      - name: Generate environment variables documentation
        run: python scripts/generate_env_docs.py

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
        continue-on-error: true

  # SAST and dependency scan run inside AlmaLinux 9 (project standard).
  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - name: CI version (confirm this is v3, AlmaLinux-focused)
        run: echo "CI workflow v3 | AlmaLinux-focused | sha=${{ github.sha }} | ref=${{ github.ref }}"

      - name: Bandit and pip-audit in AlmaLinux 9
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace -e PIP_NO_CACHE_DIR=1 \
            almalinux:9.7-20260129 bash -c '
            set -e
            dnf install -y python3.11 python3.11-pip 2>/dev/null || true
            python3.11 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install bandit pip-audit pypatch==1.0.2
            PATHS="qminiwasm/ engine/"
            if [ -d wui/backend ]; then PATHS="$PATHS wui/backend/"; fi
            set +e
            bandit -r $PATHS -c pyproject.toml -f json -o bandit-report.json
            BANDIT_RC=$?
            pip-audit -r requirements.txt -f json -o pip-audit-report.json
            PIP_AUDIT_RC=$?
            set -e
            if [ "$BANDIT_RC" -ne 0 ]; then
              echo "::error::Bandit failed (exit $BANDIT_RC)"
              exit "$BANDIT_RC"
            fi
            if [ "$PIP_AUDIT_RC" -ne 0 ]; then
              echo "::warning::pip-audit exited $PIP_AUDIT_RC (report still written); see pip-audit-report.json"
            fi
            '

      - name: Ensure report files exist
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/bandit-report.json" ]; then
            echo '{"results":[]}' > "$GITHUB_WORKSPACE/bandit-report.json"
          fi
          if [ ! -f "$GITHUB_WORKSPACE/pip-audit-report.json" ]; then
            echo '{"dependencies":[],"vulnerabilities":[]}' > "$GITHUB_WORKSPACE/pip-audit-report.json"
          fi
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
        continue-on-error: true

  training-wui-go:
    name: training-wui (Go)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go build
        working-directory: training-wui
        run: go build -o training-wui-bin .

  # Trivy image scan: gate images so only CRITICAL/HIGH-clean images can be deployed (Kyverno enforces at cluster).
  # Runs on ubuntu-latest (Docker needed to build); image built is AlmaLinux-based per project standard.
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image for scan
        run: docker build -f docker/Dockerfile.backend -t qminiwasm-backend:${{ github.sha }} .
      - name: Run Trivy image scan (fail on CRITICAL/HIGH)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          image-ref: "qminiwasm-backend:${{ github.sha }}"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          exit-code: "1"
          vuln-type: "os,library"
      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-image.sarif') != ''
        continue-on-error: true  # e.g. forks or when security-events not granted
        with:
          sarif_file: "trivy-image.sarif"
      - name: Trivy image report (table) for fixing remaining findings
        run: |
          docker run --rm -v "${{ github.workspace }}:/out" aquasec/trivy image \
            --severity CRITICAL,HIGH --vuln-type os,library --ignore-unfixed \
            --format table --output /out/trivy-image-report.txt \
            qminiwasm-backend:${{ github.sha }} || true
      - name: Upload Trivy image report
        uses: actions/upload-artifact@v7
        if: always() && hashFiles('trivy-image-report.txt') != ''
        with:
          name: trivy-image-report
          path: trivy-image-report.txt
        continue-on-error: true
      - name: Trivy image SBOM (for attestation / Kyverno verifyImages)
        run: |
          docker run --rm -v "${{ github.workspace }}:/out" aquasec/trivy image \
            --format cyclonedx --output /out/trivy-image-sbom.json \
            qminiwasm-backend:${{ github.sha }} || true
      - name: Upload Trivy image SBOM
        uses: actions/upload-artifact@v7
        with:
          name: trivy-image-sbom
          path: trivy-image-sbom.json
        continue-on-error: true

  # SPDX SBOM for container images (compliance; Packer produces QCOW2 SBOM on build host).
  # Runner is Ubuntu (Docker); image is AlmaLinux-based.
  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build backend image for SBOM
        run: docker build -f docker/Dockerfile.backend -t qminiwasm-backend:${{ github.sha }} .
      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin
      - name: Generate SPDX SBOM (syft)
        run: syft qminiwasm-backend:${{ github.sha }} -o spdx-json=sbom-backend.spdx.json
      - name: Generate SPDX SBOM (Trivy, optional)
        run: |
          docker run --rm -v "${{ github.workspace }}:/out" aquasec/trivy image \
            --format spdx-json --output /out/sbom-backend-trivy.spdx.json \
            qminiwasm-backend:${{ github.sha }} || true
      - name: Upload SPDX SBOM artifacts
        uses: actions/upload-artifact@v7
        with:
          name: sbom-spdx
          path: sbom-backend.spdx.json
        continue-on-error: true
      - name: Upload Trivy SPDX SBOM (if present)
        uses: actions/upload-artifact@v7
        if: hashFiles('sbom-backend-trivy.spdx.json') != ''
        with:
          name: sbom-spdx-trivy
          path: sbom-backend-trivy.spdx.json
        continue-on-error: true
