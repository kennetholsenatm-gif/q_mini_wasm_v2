# DevSecOps CI: lint, test, SAST, dependency scan — AlmaLinux/RHEL focused
# Version: 3 — lint/test/SAST run in AlmaLinux 9 (GH has no AlmaLinux runners).
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  # Edge AI taxonomy: fail on legacy ML terms in added lines (diff vs base branch).
  taxonomy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Taxonomy gate (changed lines only)
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            else
              BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No parent commit; skipping taxonomy diff (first commit or shallow)."
            exit 0
          fi
          python3 scripts/taxonomy_linter.py --diff-base "$BASE"

  # Deterministic trit kernels (.wasm) + TPEM sidecar for CI consumers.
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps (CI profile)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/ci.txt

      - name: Build WASM + TPEM
        run: python scripts/build_tpem_wasm_artifacts.py --out-dir dist/edge-artifacts

      - name: Verify TPEM bundle header + digest
        run: python -m qminiwasm.wasm_host.tpem_bundle verify dist/edge-artifacts/qminiwasm-weights.tpem

      - name: Upload edge artifacts
        uses: actions/upload-artifact@v7
        with:
          name: edge-artifacts
          path: |
            dist/edge-artifacts/*.wasm
            dist/edge-artifacts/*.tpem
            dist/edge-artifacts/*.json

  # Lint and test run inside AlmaLinux 9 (project standard; GH has no AlmaLinux runners).
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - name: CI version (confirm this is v3, AlmaLinux-focused)
        run: echo "CI workflow v3 | AlmaLinux-focused | sha=${{ github.sha }} | ref=${{ github.ref }}"

      - name: Lint and test in AlmaLinux 9
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace -e PIP_NO_CACHE_DIR=1 \
            almalinux:9.7-20260129 bash -c '
            set -e
            dnf install -y python3.11 python3.11-pip 2>/dev/null || true
            python3.11 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install black flake8 mypy pytest pytest-cov pypatch==1.0.2
            pip install -r requirements/ci.txt 2>/dev/null || pip install -r requirements.txt 2>/dev/null || true
            # Only pass wui/backend when it has .py files (Dockerfile-only tree is skipped; avoids black "path does not exist").
            BLACK_TARGETS=(qminiwasm/ tests/)
            FLAKE_TARGETS=(qminiwasm/ tests/)
            if [ -d wui/backend ] && [ -n "$(find wui/backend -type f -name "*.py" -print -quit 2>/dev/null)" ]; then
              BLACK_TARGETS+=(wui/backend/)
              FLAKE_TARGETS+=(wui/backend/)
            fi
            black --check "${BLACK_TARGETS[@]}"
            flake8 "${FLAKE_TARGETS[@]}" --max-line-length=100 --extend-ignore=E203,W503
            # qminiwasm/: full mypy (includes qminiwasm/engine/).
            mypy qminiwasm/ --ignore-missing-imports
            pytest tests/ -v --cov=qminiwasm --cov-report=xml --cov-report=term
            '

      - name: Ensure coverage.xml exists
        run: echo '<coverage></coverage>' > "$GITHUB_WORKSPACE/coverage.xml"
        continue-on-error: true

      - name: Generate environment variables documentation
        run: python scripts/generate_env_docs.py

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
        continue-on-error: true

  # SAST and dependency scan run inside AlmaLinux 9 (project standard).
  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - name: CI version (confirm this is v3, AlmaLinux-focused)
        run: echo "CI workflow v3 | AlmaLinux-focused | sha=${{ github.sha }} | ref=${{ github.ref }}"

      - name: Bandit and pip-audit in AlmaLinux 9
        run: |
          docker run --rm -v "${{ github.workspace }}:/workspace" -w /workspace -e PIP_NO_CACHE_DIR=1 \
            almalinux:9.7-20260129 bash -c '
            set -e
            dnf install -y python3.11 python3.11-pip 2>/dev/null || true
            python3.11 -m venv .venv
            . .venv/bin/activate
            pip install --upgrade pip
            pip install bandit pip-audit pypatch==1.0.2
            PATHS="qminiwasm/"
            if [ -d wui/backend ]; then PATHS="$PATHS wui/backend/"; fi
            set +e
            bandit -r $PATHS -c pyproject.toml -f json -o bandit-report.json
            BANDIT_RC=$?
            pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539 -f json -o pip-audit-report.json
            PIP_AUDIT_RC=$?
            set -e
            if [ "$BANDIT_RC" -ne 0 ]; then
              echo "::error::Bandit failed (exit $BANDIT_RC)"
              exit "$BANDIT_RC"
            fi
            if [ "$PIP_AUDIT_RC" -ne 0 ]; then
              echo "::warning::pip-audit exited $PIP_AUDIT_RC (report still written); see pip-audit-report.json"
            fi
            '

      - name: Ensure report files exist
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/bandit-report.json" ]; then
            echo '{"results":[]}' > "$GITHUB_WORKSPACE/bandit-report.json"
          fi
          if [ ! -f "$GITHUB_WORKSPACE/pip-audit-report.json" ]; then
            echo '{"dependencies":[],"vulnerabilities":[]}' > "$GITHUB_WORKSPACE/pip-audit-report.json"
          fi
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
        continue-on-error: true

  training-wui-go:
    name: training-wui (Go)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go build
        working-directory: training-wui
        run: go build -o training-wui-bin .

  # Trivy image SARIF upload for container code scanning alerts.
  # Uses the legacy category name to supersede/close stale findings from older image paths.
  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image for scan
        run: docker build -f serverless/Dockerfile -t qminiwasm-backend:local .

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "image"
          image-ref: "qminiwasm-backend:local"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: "trivy-image.sarif"
          category: ".github/workflows/ci.yml:trivy-image"
