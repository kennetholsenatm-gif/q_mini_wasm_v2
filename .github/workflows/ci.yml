# DevSecOps CI: lint, test, SAST, dependency scan
# Version: 2 (security: scan-tools-only, conditional uploads, pip-audit -r requirements.txt)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:  # Run manually from Actions tab

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify workflow version
        run: echo "Using CI workflow v2 (fix for 23031658589)"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements/ci.txt ]; then pip install -r requirements/ci.txt; else pip install -r requirements.txt; fi

      - name: Black
        run: black --check qminiwasm/ tests/

      - name: Flake8
        run: flake8 qminiwasm/ tests/ --max-line-length=100 --extend-ignore=E203,W503

      - name: MyPy
        run: mypy qminiwasm/ --ignore-missing-imports || true

      - name: Unit tests
        run: pytest tests/ -v --cov=qminiwasm --cov-report=xml --cov-report=term

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: hashFiles('coverage.xml') != ''
        with:
          name: coverage
          path: coverage.xml

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install scan tools only
        run: |
          python -m pip install --upgrade pip
          pip install bandit pip-audit

      - name: Bandit (SAST)
        run: bandit -r qminiwasm/ -f json -o bandit-report.json || true
        continue-on-error: true

      - name: pip-audit (dependency scan)
        run: |
          pip-audit -r requirements.txt -f json -o pip-audit-report.json 2>/dev/null || \
          pip-audit -r requirements.txt -f json > pip-audit-report.json 2>/dev/null || \
          echo '{"dependencies":[],"vulnerabilities":[]}' > pip-audit-report.json
        continue-on-error: true

      - name: Semgrep (optional)
        run: pip install semgrep && semgrep scan --config=auto qminiwasm/ --json -o semgrep-report.json || true
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: hashFiles('bandit-report.json') != ''
        with:
          name: bandit-report
          path: bandit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: hashFiles('pip-audit-report.json') != ''
        with:
          name: pip-audit-report
          path: pip-audit-report.json
