# DevSecOps CI: lint, test, SAST, dependency scan — AlmaLinux/RHEL focused
# Version: 4 — lint/test/SAST on ubuntu-latest + setup-python (avoids Docker Hub base pulls).
name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    # Stacked PRs (e.g. base = pr/feature-branch) must still run the same gates as main.
    branches:
      - main
      - "pr/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  # Edge AI taxonomy: fail on legacy ML terms in added lines (diff vs base branch).
  taxonomy-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Taxonomy gate (changed lines only)
        shell: bash
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            BEFORE="${{ github.event.before }}"
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              BASE="$BEFORE"
            else
              BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
            fi
          else
            BASE="$(git rev-parse HEAD^ 2>/dev/null || true)"
          fi
          if [ -z "$BASE" ]; then
            echo "No parent commit; skipping taxonomy diff (first commit or shallow)."
            exit 0
          fi
          cd training-wui && go run ./cmd/qmw-taxonomy-linter --root .. --config ../configs/ci/taxonomy_linter.json --diff-base "$BASE"

  # Deterministic trit kernels (.wasm) + TPEM sidecar for CI consumers (Go + wabt; no Python on this job).
  build-artifacts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: Install wat2wasm (wabt)
        run: |
          sudo apt-get update
          sudo apt-get install -y wabt

      - name: Build WASM + TPEM (Go)
        run: |
          mkdir -p dist/edge-artifacts
          cd training-wui && go run ./cmd/qmw-build-edge-artifacts --repo-root .. --out-dir ../dist/edge-artifacts --tier 2

      - name: Verify TPEM bundle header + digest
        run: cd training-wui && go run ./cmd/qmw-build-edge-artifacts --verify-tpem ../dist/edge-artifacts/qminiwasm-weights.tpem

      - name: Verify artifact contract manifest + checksums
        run: cd training-wui && go run ./cmd/qmw-build-edge-artifacts --verify-contract ../dist/edge-artifacts

      - name: Upload edge artifacts
        uses: actions/upload-artifact@v7
        with:
          name: edge-artifacts
          path: |
            dist/edge-artifacts/*.wasm
            dist/edge-artifacts/*.tpem
            dist/edge-artifacts/*.json
            dist/edge-artifacts/*.zip

  # Lint and test on the GitHub-hosted runner (Python 3.11); same commands as prior AlmaLinux-in-Docker path.
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      QMINIWASM_WASM_FALLBACK_POLICY: "error"
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"

      - name: training-wui Go unit tests
        run: cd training-wui && go test ./...

      - name: CI version (confirm this is v4, host Python 3.11)
        run: echo "CI workflow v4 | host Python 3.11 | sha=${{ github.sha }} | ref=${{ github.ref }}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Lint and test
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install black flake8 mypy pytest pytest-cov pypatch==1.0.2
          if ! pip install -r requirements/ci.txt; then
            echo "::warning::requirements/ci.txt failed; falling back to requirements.txt"
            pip install -r requirements.txt
          fi
          # Register the import package (benchmarks and coverage import qminiwasm by name).
          pip install -e . --no-deps
          # Only pass wui/backend when it has .py files (Dockerfile-only tree is skipped; avoids black "path does not exist").
          BLACK_TARGETS=(qminiwasm/ tests/)
          FLAKE_TARGETS=(qminiwasm/ tests/)
          if [ -d wui/backend ] && [ -n "$(find wui/backend -type f -name "*.py" -print -quit 2>/dev/null)" ]; then
            BLACK_TARGETS+=(wui/backend/)
            FLAKE_TARGETS+=(wui/backend/)
          fi
          black --check "${BLACK_TARGETS[@]}"
          flake8 "${FLAKE_TARGETS[@]}" --max-line-length=100 --extend-ignore=E203,W503
          # qminiwasm/: full mypy (includes qminiwasm/engine/).
          mypy qminiwasm/ --ignore-missing-imports
          pytest tests/ -v --cov=qminiwasm --cov-report=xml --cov-report=term
          # CI strict WASM profile: real path + fail-fast runtime fallback.
          QMINIWASM_WASM_BACKEND=wasmtime QMINIWASM_WASM_FALLBACK_POLICY=error \
            pytest tests/test_wasm_memory_corpus.py::test_wasm_engine_execute_reports_execution_origin -v

      - name: Ensure coverage.xml exists
        run: echo '<coverage></coverage>' > "$GITHUB_WORKSPACE/coverage.xml"
        continue-on-error: true

      - name: Generate environment variables documentation
        run: cd training-wui && go run ./cmd/qmw-generate-env-docs --root ..

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.xml
        continue-on-error: true

  # SAST and dependency scan on the GitHub-hosted runner (Python 3.11).
  security:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6

      - name: CI version (confirm this is v4, host Python 3.11)
        run: echo "CI workflow v4 | host Python 3.11 | sha=${{ github.sha }} | ref=${{ github.ref }}"

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Bandit and pip-audit
        run: |
          set -e
          python -m pip install --upgrade pip
          pip install bandit pip-audit pypatch==1.0.2
          PATHS="qminiwasm/"
          if [ -d wui/backend ]; then PATHS="$PATHS wui/backend/"; fi
          set +e
          bandit -r $PATHS -c pyproject.toml -f json -o bandit-report.json
          BANDIT_RC=$?
          pip-audit -r requirements.txt --ignore-vuln CVE-2026-4539 -f json -o pip-audit-report.json
          PIP_AUDIT_RC=$?
          set -e
          if [ "$BANDIT_RC" -ne 0 ]; then
            echo "::error::Bandit failed (exit $BANDIT_RC)"
            exit "$BANDIT_RC"
          fi
          if [ "$PIP_AUDIT_RC" -ne 0 ]; then
            echo "::warning::pip-audit exited $PIP_AUDIT_RC (report still written); see pip-audit-report.json"
          fi

      - name: Ensure report files exist
        run: |
          if [ ! -f "$GITHUB_WORKSPACE/bandit-report.json" ]; then
            echo '{"results":[]}' > "$GITHUB_WORKSPACE/bandit-report.json"
          fi
          if [ ! -f "$GITHUB_WORKSPACE/pip-audit-report.json" ]; then
            echo '{"dependencies":[],"vulnerabilities":[]}' > "$GITHUB_WORKSPACE/pip-audit-report.json"
          fi
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
        continue-on-error: true

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v7
        with:
          name: pip-audit-report
          path: pip-audit-report.json
        continue-on-error: true

  training-wui-go:
    name: training-wui (Go)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
      - name: Go build
        working-directory: training-wui
        run: go build -o training-wui-bin .

  # Trivy image SARIF upload for container code scanning alerts.
  # Uses the legacy category name to supersede/close stale findings from older image paths.
  trivy-image:
    name: trivy-image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v6

      - name: Build backend image for scan
        run: docker build -f serverless/Dockerfile -t qminiwasm-backend:local .

      - name: Run Trivy image scan (SARIF)
        uses: aquasecurity/trivy-action@0.35.0
        with:
          scan-type: "image"
          image-ref: "qminiwasm-backend:local"
          format: "sarif"
          output: "trivy-image.sarif"
          severity: "CRITICAL,HIGH"
          ignore-unfixed: true
          # Upload SARIF for GitHub Security tab; do not fail the check on findings (image may lag patches).
          exit-code: "0"

      - name: Upload Trivy image SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-image.sarif') != ''
        with:
          sarif_file: "trivy-image.sarif"
          category: ".github/workflows/ci.yml:trivy-image"
