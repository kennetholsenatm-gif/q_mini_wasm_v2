name: Architecture Enforcement

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  enforce-architecture:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        
    - name: Run Architecture Enforcement Checks
      run: |
        python scripts/enforce_architecture.py --json reports/architecture_enforcement_report.json

    - name: Run GF(3) Integrity Validator
      run: |
        python scripts/validate_gf3_integrity.py

    - name: Upload Architecture Reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: architecture-enforcement-reports
        path: |
          reports/architecture_enforcement_report.json
        retention-days: 14
