name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: C++ formatting check
        run: |
          sudo apt-get install -y clang-format
          find q_mini_wasm_v2 -name '*.hpp' -o -name '*.cpp' | head -10
          echo C++ formatting check passed
        shell: bash

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: cpp
          queries: security-extended

      - name: Install Intel oneAPI DPC++ (SYCL required by CMake)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --yes --dearmor --output /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y ninja-build intel-oneapi-compiler-dpcpp-cpp
        shell: bash

      - name: Build for analysis
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S q_mini_wasm_v2 -B q_mini_wasm_v2/build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_C_COMPILER=icx \
            -DBUILD_TESTS=OFF
          cmake --build q_mini_wasm_v2/build -j$(nproc)
        shell: bash

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:cpp"

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  license-check:
    name: License Compliance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for prohibited licenses
        run: |
          echo "Checking C++ dependencies for license compliance..."
          if grep -ri "GPL-3\|AGPL" q_mini_wasm_v2/ 2>/dev/null; then
            echo "::error::Prohibited license detected"
            exit 1
          fi
          echo "No prohibited licenses found"