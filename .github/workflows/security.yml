# DevSecOps Security: scheduled and on-release scans (secrets, dependencies, optional Trivy)
name: Security

on:
  schedule:
    - cron: "0 6 * * 1"
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies and pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pip-audit

      - name: Run pip-audit (audit only)
        run: pip-audit || true
        continue-on-error: true

      - name: Generate SBOM (CycloneDX)
        run: |
          pip-audit -f cyclonedx-json -o sbom.json || echo '{"bomFormat":"CycloneDX","specVersion":"1.4","version":1,"components":[]}' > sbom.json
        continue-on-error: true

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        if: hashFiles('sbom.json') != ''
        with:
          name: sbom-cyclonedx
          path: sbom.json

      - name: Generate empty pip-audit report if needed
        if: hashFiles('pip-audit-report.json') == ''
        run: echo '{"dependencies":[],"vulnerabilities":[]}' > pip-audit-report.json

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: hashFiles('pip-audit-report.json') != ''
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Gitleaks (secret scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Generate empty bandit report if needed
        if: hashFiles('bandit-report.json') == ''
        run: echo '{"results": []}' > bandit-report.json

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: hashFiles('bandit-report.json') != ''
        with:
          name: bandit-report
          path: bandit-report.json

  trivy-filesystem:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v6

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "fs"
          scan-ref: "."
          format: "sarif"
          output: "trivy-fs.sarif"
        continue-on-error: true

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always() && hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: "trivy-fs.sarif"
        continue-on-error: true

      - name: Generate empty Trivy report if needed
        if: hashFiles('trivy-fs.sarif') == ''
        run: echo '{"runs": []}' > trivy-fs.sarif

      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v4
        if: hashFiles('trivy-fs.sarif') != ''
        with:
          sarif_file: "trivy-fs.sarif"
        continue-on-error: true
