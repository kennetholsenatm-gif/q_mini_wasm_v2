# OpenTofu infra: plan/apply when infra/opentofu/desired changes
# Triggered by WUI backend writing tfvars under infra/opentofu/desired/.
# Runs tofu init, plan, and (on default branch) apply in the matching provider module.
# Credentials: set VAULT_ADDR, VAULT_TOKEN (and provider-specific secrets) in repo secrets.
name: OpenTofu Infra

on:
  push:
    branches: [main, master]
    paths:
      - 'infra/opentofu/desired/**'
  pull_request:
    branches: [main, master]
    paths:
      - 'infra/opentofu/desired/**'
  workflow_dispatch:
    inputs:
      var_file:
        description: 'Optional: specific tfvars file (e.g. lambda-abc123.tfvars.json)'
        required: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

defaults:
  run:
    shell: bash

jobs:
  discover:
    name: Discover desired configs
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.out.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List desired configs and derive providers
        id: out
        run: |
          DESIRED_DIR="infra/opentofu/desired"
          if [ ! -d "$DESIRED_DIR" ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo "No desired dir; skipping OpenTofu jobs."
            exit 0
          fi

          # On workflow_dispatch with input, use that file only
          if [ -n "${{ github.event.inputs.var_file }}" ]; then
            VF="${{ github.event.inputs.var_file }}"
            if [ -f "$DESIRED_DIR/$VF" ]; then
              PROVIDER="${VF%%-*}"
              echo "matrix=[{\"provider\":\"$PROVIDER\",\"var_file\":\"$VF\"}]" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi

          # Collect changed/added *.tfvars.json
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD -- "$DESIRED_DIR" 2>/dev/null || true)
          else
            CHANGED=$(git diff --name-only HEAD~1 HEAD -- "$DESIRED_DIR" 2>/dev/null || true)
          fi
          if [ -z "$CHANGED" ]; then
            CHANGED=$(find "$DESIRED_DIR" -maxdepth 1 -name '*.tfvars.json' 2>/dev/null | xargs -r -I{} basename {} || true)
          fi

          # Build matrix: one entry per provider with its var_file (first matching file per provider)
          MATRIX=""
          for f in $CHANGED; do
            base=$(basename "$f")
            case "$base" in
              *.tfvars.json)
                provider="${base%%-*}"
                if [ -d "infra/opentofu/$provider" ]; then
                  # Avoid duplicate provider: only add if not already in MATRIX
                  if echo "$MATRIX" | grep -q "\"$provider\""; then
                    :
                  else
                    entry="{\"provider\":\"$provider\",\"var_file\":\"$base\"}"
                    if [ -z "$MATRIX" ]; then MATRIX="$entry"; else MATRIX="$MATRIX,$entry"; fi
                  fi
                fi
                ;;
              *) ;;
            esac
          done
          if [ -z "$MATRIX" ]; then
            echo 'matrix=[]' >> "$GITHUB_OUTPUT"
            echo "No matching provider modules or tfvars; skipping OpenTofu jobs."
            exit 0
          fi
          echo "matrix=[$MATRIX]" >> "$GITHUB_OUTPUT"

  opentofu:
    name: OpenTofu (${{ matrix.provider }})
    runs-on: ubuntu-latest
    # Optional: use GitHub Environment for manual approval before apply
    # environment: production
    env:
      VAULT_ADDR: ${{ secrets.VAULT_ADDR }}
      VAULT_TOKEN: ${{ secrets.VAULT_TOKEN }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover.outputs.matrix) }}
    needs: [discover]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: "1.9.0"
          tofu_wrapper: false

      - name: OpenTofu Init
        working-directory: infra/opentofu/${{ matrix.provider }}
        run: tofu init -input=false

      - name: OpenTofu Plan
        working-directory: infra/opentofu/${{ matrix.provider }}
        run: |
          VARFILE="${{ matrix.var_file }}"
          if [ -n "$VARFILE" ]; then
            tofu plan -input=false -var-file="../../desired/$VARFILE" -out=tfplan
          else
            tofu plan -input=false -out=tfplan
          fi

      - name: OpenTofu Apply
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        working-directory: infra/opentofu/${{ matrix.provider }}
        run: |
          VARFILE="${{ matrix.var_file }}"
          if [ -n "$VARFILE" ]; then
            tofu apply -input=false -auto-approve -var-file="../../desired/$VARFILE"
          else
            tofu apply -input=false -auto-approve tfplan
          fi
