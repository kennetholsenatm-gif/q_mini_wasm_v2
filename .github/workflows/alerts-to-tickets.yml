# Monitor GitHub alerts and create tickets for critical issues
# Project: https://github.com/users/kennetholsenatm-gif/projects/3
# View:   https://github.com/users/kennetholsenatm-gif/projects/3/views/1
name: GitHub Alerts to Tickets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: '0 */6 * * *'  # Run every 6 hours
  workflow_dispatch:       # Allow manual triggering

permissions:
  contents: read
  security-events: read
  issues: write
  repository-projects: write

jobs:
  check-alerts-and-create-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: Get repository alerts
        id: get-alerts
        uses: actions/github-script@v8
        with:
          script: |
            const { data: alerts } = await github.rest.security.getAlerts({
              owner: context.repo.owner,
              repo: context.repo.repo
            });

            const criticalAlerts = alerts.filter(alert => 
              alert.security_advisory.severity === 'CRITICAL' ||
              alert.security_advisory.severity === 'HIGH'
            );

            core.setOutput('alerts', JSON.stringify(criticalAlerts));
            core.setOutput('has_critical', criticalAlerts.length > 0);

      - name: Create tickets for critical alerts
        if: steps.get-alerts.outputs.has_critical == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            const alerts = JSON.parse(context.payload.alerts);
            const repoOwner = context.repo.owner;
            const repoName = context.repo.repo;

            for (const alert of alerts) {
              const body = [
                '## Critical Security Alert',
                '',
                `- **Severity:** ${alert.security_advisory.severity}`,
                `- **Type:** ${alert.security_advisory.cve || alert.security_advisory.ghsa_id}`,
                `- **Package:** ${alert.security_advisory.affected_package_name}`,
                `- **Vulnerable Versions:** ${alert.security_advisory.affected_range}`,
                `- **Patched Versions:** ${alert.security_advisory.patched_versions || 'N/A'}`,
                '',
                `**Description:** ${alert.security_advisory.overview}`,
                '',
                `**Remediation:** Update to a patched version or apply the recommended fix.`,
                '',
                `**References:**`,
                `- [Security Advisory](${alert.security_advisory.url})`,
                `- [Alert Details](${alert.html_url})`,
                '',
                '---',
                '### Next Steps:',
                '1. Review the affected code and dependencies',
                '2. Update to a secure version if available',
                '3. Test the changes in a development environment',
                '4. Deploy the fix to production',
                '5. Verify the alert is resolved'
              ].join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner: repoOwner,
                repo: repoName,
                title: `🚨 Critical Alert: ${alert.security_advisory.severity} - ${alert.security_advisory.affected_package_name}`,
                body,
                labels: ['security', 'critical', 'automated', 'needs-triage', 'alert']
              });

              core.info(`Created issue #${issue.number} for alert: ${alert.security_advisory.severity}`);

              // Add to project
              if (process.env.ADD_TO_PROJECT_TOKEN) {
                try {
                  const result = await github.graphql(`
                    query {
                      user(login: "kennetholsenatm-gif") {
                        projectV2(number: 3) { id }
                      }
                    }
                  `);
                  const projectId = result?.user?.projectV2?.id;

                  if (projectId) {
                    await github.graphql(`
                      mutation($projectId: ID!, $contentId: ID!) {
                        addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                          item { id }
                        }
                      }
                    `, { projectId, contentId: issue.node_id });

                    core.info(`Added issue #${issue.number} to project #3`);
                  }
                } catch (error) {
                  core.error(`Failed to add issue to project: ${error.message}`);
                }
              }
            }

      - name: Summary
        run: |
          if [ "${{ steps.get-alerts.outputs.has_critical }}" = "true" ]; then
            echo "Created tickets for critical alerts. Check the repository issues and project board."
          else
            echo "No critical alerts found. No tickets created."
          fi