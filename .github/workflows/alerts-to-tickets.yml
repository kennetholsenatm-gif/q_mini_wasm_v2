# Monitor Dependabot alerts and open issues for HIGH/CRITICAL findings.
# Uses github.rest.dependabot.listAlertsForRepo (Dependabot API).
# New issues are picked up by add-to-project.yml when ADD_TO_PROJECT_TOKEN is set.
# Project: https://github.com/users/kennetholsenatm-gif/projects/3
name: GitHub Alerts to Tickets

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: read
  issues: write

jobs:
  check-alerts-and-create-tickets:
    runs-on: ubuntu-latest
    steps:
      - name: List Dependabot alerts and create issues
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            let alerts = [];
            try {
              alerts = await github.paginate(github.rest.dependabot.listAlertsForRepo, {
                owner,
                repo,
                state: 'open',
                per_page: 100,
              });
            } catch (error) {
              const message = String(error?.message || '');
              if (error?.status === 403 && message.includes('Dependabot alerts are disabled')) {
                core.notice('Dependabot alerts are disabled for this repository; skipping ticket creation.');
                return;
              }
              throw error;
            }

            const critical = alerts.filter((a) => {
              const sev = (a.security_advisory?.severity || '').toLowerCase();
              return sev === 'critical' || sev === 'high';
            });

            if (critical.length === 0) {
              core.info('No HIGH/CRITICAL Dependabot alerts.');
              return;
            }

            const { data: existing } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'alert',
              per_page: 100,
            });
            const existingTitles = new Set(existing.map((i) => i.title));

            for (const alert of critical) {
              const adv = alert.security_advisory;
              const title = `Security: ${adv?.summary || adv?.ghsa_id || 'Dependabot'} (${alert.number})`;
              if (existingTitles.has(title)) {
                core.info(`Skip duplicate: ${title}`);
                continue;
              }

              const body = [
                '## Dependabot security alert',
                '',
                `- **Severity:** ${adv?.severity || 'unknown'}`,
                `- **Package:** ${alert.dependency?.package?.name || 'n/a'}`,
                `- **Manifest:** ${alert.dependency?.manifest_path || 'n/a'}`,
                `- **Vulnerable range:** ${alert.security_vulnerability?.vulnerable_version_range || 'n/a'}`,
                '',
                adv?.description ? `**Advisory:** ${String(adv.description).slice(0, 2000)}` : '',
                '',
                `**Alert URL:** ${alert.html_url}`,
                adv?.identifiers?.length ? `**IDs:** ${adv.identifiers.map((i) => i.value).join(', ')}` : '',
              ].filter(Boolean).join('\n');

              const { data: issue } = await github.rest.issues.create({
                owner,
                repo,
                title,
                body,
                labels: ['security', 'critical', 'automated', 'needs-triage', 'alert'],
              });
              existingTitles.add(title);
              core.info(`Created issue #${issue.number} for Dependabot alert ${alert.number}`);
            }

      - name: Summary
        run: echo "Finished Dependabot alert sweep."
