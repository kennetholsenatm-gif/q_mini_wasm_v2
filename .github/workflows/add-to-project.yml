# Auto-add new issues and PRs to GitHub Project #3 (LLM Modeling practice)
# Project: https://github.com/users/kennetholsenatm-gif/projects/3
# View:   https://github.com/users/kennetholsenatm-gif/projects/3/views/1
# Requires repo secret ADD_TO_PROJECT_TOKEN (PAT with project scope)
name: Add to project

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]
    branches: [main, master]

permissions:
  contents: read

jobs:
  add-to-project:
    if: github.repository == 'kennetholsenatm-gif/LLM_Pract'
    runs-on: ubuntu-latest
    steps:
      - name: Get project ID
        id: project
        if: ${{ secrets.ADD_TO_PROJECT_TOKEN != '' }}
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}
          script: |
            const result = await github.graphql(`
              query {
                user(login: "kennetholsenatm-gif") {
                  projectV2(number: 3) { id }
                }
              }
            `);
            const projectId = result?.user?.projectV2?.id;
            if (!projectId) throw new Error('Could not find project (check ADD_TO_PROJECT_TOKEN and project number)');
            core.setOutput('project_id', projectId);
        continue-on-error: true

      - name: Add issue to project
        if: github.event_name == 'issues' && secrets.ADD_TO_PROJECT_TOKEN != '' && steps.project.outputs.project_id != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}
          script: |
            const projectId = '${{ steps.project.outputs.project_id }}';
            const contentId = context.payload.issue.node_id;
            await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }
            `, { projectId, contentId });
            core.notice('Issue added to LLM Modeling practice (project #3)');
        continue-on-error: true

      - name: Add pull request to project
        if: github.event_name == 'pull_request' && secrets.ADD_TO_PROJECT_TOKEN != '' && steps.project.outputs.project_id != ''
        uses: actions/github-script@v8
        with:
          github-token: ${{ secrets.ADD_TO_PROJECT_TOKEN }}
          script: |
            const projectId = '${{ steps.project.outputs.project_id }}';
            const contentId = context.payload.pull_request.node_id;
            await github.graphql(`
              mutation($projectId: ID!, $contentId: ID!) {
                addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                  item { id }
                }
              }
            `, { projectId, contentId });
            core.notice('Pull request added to LLM Modeling practice (project #3)');
        continue-on-error: true

      - name: Skip (no ADD_TO_PROJECT_TOKEN)
        if: secrets.ADD_TO_PROJECT_TOKEN == ''
        run: |
          echo "ADD_TO_PROJECT_TOKEN secret not set. Add a PAT with project scope in repo Settings → Secrets to auto-add issues/PRs to project #3."
          exit 0
