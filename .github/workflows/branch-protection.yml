# Informational only: real branch protection is configured in GitHub repo Settings → Rules.
name: Branch Protection
on:
  push:
    branches:
      - master
      - develop
  pull_request:
    branches:
      - master
      - develop

permissions: {}

jobs:
  protect-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Check branch protection
        run: |
          echo "Branch protection rules are enforced for master and develop branches"
          echo "All changes must go through pull requests with reviews"