name: Multi-Language Build Pipeline

on:
  workflow_call:
  workflow_dispatch:

jobs:
  build-cpp:
    name: Build C++
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake
        run: cmake -S q_mini_wasm_v2 -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=ON -DBUILD_DLL=ON
        shell: bash
      - name: Build
        run: cmake --build build --config Release -j4
        shell: bash
      - name: Test
        working-directory: build
        run: ctest --build-config Release --output-on-failure
        shell: bash

  build-rust:
    name: Build Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Build Rust
        run: cd q_mini_wasm_v2/rust && cargo build --release 2>/dev/null || echo Rust build skipped
        shell: bash

  build-go:
    name: Build Go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22
      - name: Build Go
        run: cd q_mini_wasm_v2/go && go build ./cmd/gateway 2>/dev/null || echo Go build skipped
        shell: bash

  build-r:
    name: Build R
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 4.3.0
      - name: Build R
        run: cd q_mini_wasm_v2/r && R CMD build . 2>/dev/null || echo R build skipped
        shell: bash

  build-dll:
    name: Build DLL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure CMake with DLL
        run: cmake -S q_mini_wasm_v2 -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_DLL=ON -DBUILD_SHARED_LIBS=ON
        shell: bash
      - name: Build DLL
        run: cmake --build build --config Release -j4
        shell: bash
