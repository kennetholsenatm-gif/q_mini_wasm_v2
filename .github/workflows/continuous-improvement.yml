name: Continuous Improvement Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

env:
  PROJECT_ROOT: q_mini_wasm_v2
  RAG_SERVER: qminiwasm-rag-service
  AUTOLEARN_SERVER: qminiwasm-autolearn

jobs:
  analyze-and-improve:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Analyze RAG Service Performance
        id: rag-analysis
        run: |
          echo 'Analyzing RAG service performance...'
          python scripts/analyze_rag_performance.py --config config/kanban-config.json --output rag-analysis-results.json

      - name: Analyze MCP Servers
        id: mcp-analysis
        run: |
          echo 'Analyzing MCP servers...'
          python scripts/analyze_mcp_servers.py --config config/kanban-config.json --mcp-dir .mcp-servers --output mcp-analysis-results.json

      - name: Detect Needed Improvements
        id: detect-improvements
        run: |
          echo 'Detecting needed improvements...'
          python scripts/detect_improvements.py --rag-analysis rag-analysis-results.json --mcp-analysis mcp-analysis-results.json --output improvements-detected.json

      - name: Generate Improvements
        id: generate-improvements
        run: |
          echo 'Generating improvements...'
          python scripts/generate_improvements.py --input improvements-detected.json --output-dir generated-improvements

      - name: Validate Improvements
        id: validate-improvements
        run: |
          echo 'Validating improvements...'
          python scripts/validate_improvements.py --input-dir generated-improvements --config config/kanban-config.json --output validation-results.json

      - name: Update RAG Service
        if: success()
        run: |
          echo 'Updating RAG service...'
          python scripts/update_rag_service.py --improvements generated-improvements/rag --config config/kanban-config.json

      - name: Update MCP Servers
        if: success()
        run: |
          echo 'Updating MCP servers...'
          python scripts/update_mcp_servers.py --improvements generated-improvements/mcp --mcp-dir .mcp-servers --config config/kanban-config.json

      - name: Generate New MCP Servers
        if: success()
        run: |
          echo 'Generating new MCP servers if needed...'
          python scripts/generate_new_mcps.py --analysis mcp-analysis-results.json --config config/kanban-config.json --output-dir .mcp-servers

      - name: Update Kanban Status
        if: always()
        run: |
          echo 'Updating Kanban status...'
          python scripts/update_kanban_status.py --config config/kanban-config.json --results validation-results.json

      - name: Create Pull Request
        if: success() && github.event_name == 'schedule'
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: 'chore: continuous improvement updates'
          title: 'Continuous Improvement: RAG and MCP Updates'
          body: |
            Automated improvements generated by Continuous Improvement Pipeline
            Changes:
            - RAG service optimizations
            - MCP server improvements
            - New MCP servers generated (if needed)
          branch: continuous-improvement/automated

  monitor-and-report:
    runs-on: ubuntu-latest
    needs: analyze-and-improve

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Improvement Report
        run: |
          echo 'Generating improvement report...'
          python scripts/generate_improvement_report.py --config config/kanban-config.json --output improvement-report.md

      - name: Update Documentation
        run: |
          echo 'Updating documentation...'
          python scripts/update_documentation.py --config config/kanban-config.json --report improvement-report.md
