name: Gemini Agent Auto-Improvement

on:
  schedule:
    # Run weekly on Sundays at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:
    inputs:
      server_name:
        description: 'MCP server to analyze (leave empty for all)'
        required: false
        default: ''
      analysis_type:
        description: 'Type of analysis'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - performance
          - usability
          - coverage

env:
  GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

jobs:
  analyze:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          cd q_mini_wasm_v2/agents/gemini_improver
          pip install -r requirements.txt
      
      - name: Run analysis
        run: |
          cd q_mini_wasm_v2/agents/gemini_improver
          if [ -z "${{ github.event.inputs.server_name }}" ]; then
            python integrate.py analyze
          else
            python agent.py ${{ github.event.inputs.server_name }} ${{ github.event.inputs.analysis_type }}
          fi
      
      - name: Generate improvement report
        run: |
          cd q_mini_wasm_v2/agents/gemini_improver
          python integrate.py report
      
      - name: Upload analysis results
        uses: actions/upload-artifact@v4
        with:
          name: gemini-analysis-${{ github.run_id }}
          path: q_mini_wasm_v2/agents/gemini_improver/output/
          retention-days: 30
      
      - name: Create improvement issue
        if: github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            
            // Find the latest report
            const outputDir = 'q_mini_wasm_v2/agents/gemini_improver/output';
            const files = fs.readdirSync(outputDir);
            const reportFiles = files.filter(f => f.startsWith('improvement_report_'));
            
            if (reportFiles.length === 0) {
              console.log('No report files found');
              return;
            }
            
            const latestReport = reportFiles.sort().pop();
            const reportPath = path.join(outputDir, latestReport);
            const report = JSON.parse(fs.readFileSync(reportPath, 'utf8'));
            
            // Create issue if there are high-priority suggestions
            if (report.summary.high_priority_suggestions > 0) {
              const issueBody = 
            ## Gemini Agent Auto-Improvement Report
            
            **Date:** ${report.timestamp}
            **Total Servers:** ${report.summary.total_servers}
            **Analyzed Servers:** ${report.summary.analyzed_servers}
            **Total Suggestions:** ${report.summary.total_suggestions}
            **High Priority Suggestions:** ${report.summary.high_priority_suggestions}
            
            ### Recommendations
            
            ${report.recommendations.map(r => - **${r.priority}: ${r.action}).join('\n')}
            
            ### Next Steps
            
            1. Review the attached analysis report
            2. Address high-priority suggestions
            3. Run manual improvements if needed
            
            ### Full Report
            
            See attached artifact for detailed analysis.
            ;
              
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: Auto-Improvement: ${report.summary.high_priority_suggestions} high-priority suggestions,
                body: issueBody,
                labels: ['auto-improvement', 'gemini-agent']
              });
            }
      
      - name: Notify on completion
        if: always()
        run: |
          echo "Gemini Agent Auto-Improvement completed"
          echo "Status: ${{ job.status }}"
          echo "Run ID: ${{ github.run_id }}"
