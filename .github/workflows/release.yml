name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v1.0.0)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  build-release:
    name: Build Release Artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Install Intel oneAPI DPC++ (SYCL required)
        run: |
          wget -qO- https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB | sudo gpg --yes --dearmor --output /usr/share/keyrings/oneapi-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/oneapi-archive-keyring.gpg] https://apt.repos.intel.com/oneapi all main" | sudo tee /etc/apt/sources.list.d/oneAPI.list
          sudo apt-get update
          sudo apt-get install -y ninja-build intel-oneapi-compiler-dpcpp-cpp
        shell: bash

      - name: Build native
        run: |
          source /opt/intel/oneapi/setvars.sh
          cmake -S q_mini_wasm_v2 -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_COMPILER=icpx \
            -DCMAKE_C_COMPILER=icx \
            -DBUILD_TESTS=OFF
          cmake --build build -j$(nproc)
          tar -czf q_mini_wasm_v2-linux-x86_64.tar.gz -C build .
        shell: bash

      - name: Generate SBOM
        run: |
          cat > sbom-spdx.json << 'SBOM'
          {
            "spdxVersion": "SPDX-2.3",
            "dataLicense": "CC0-1.0",
            "SPDXID": "SPDXRef-DOCUMENT",
            "name": "q_mini_wasm_v2",
            "documentNamespace": "https://github.com/kennetholsenatm-gif/q_mini_wasm_v2",
            "creationInfo": {
              "created": "2026-04-02T00:00:00Z",
              "creators": ["Tool: github-actions"]
            },
            "packages": [
              {
                "SPDXID": "SPDXRef-Package",
                "name": "q_mini_wasm_v2",
                "downloadLocation": "NOASSERTION",
                "filesAnalyzed": false,
                "licenseConcluded": "NOASSERTION",
                "licenseDeclared": "NOASSERTION",
                "copyrightText": "NOASSERTION"
              }
            ]
          }
          SBOM

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ steps.version.outputs.tag }}
          path: |
            q_mini_wasm_v2-linux-x86_64.tar.gz
            sbom-spdx.json

  create-release:
    name: Create GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.build-release.outputs.tag || github.ref_name }}
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/q_mini_wasm_v2-linux-x86_64.tar.gz
            artifacts/sbom-spdx.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}