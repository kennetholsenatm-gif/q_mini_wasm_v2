[training]
epochs = 100
batch_size = 32768
checkpoint_interval = 10
learning_rate = 10
buffer_profile = "aggressive"

[model]
moe_experts = 8192
moe_top_k = 128
context_window = 8192
entanglement_tokens = 1024
shadow_dim = 4096
num_layers = 64
neurons_per_layer = 2048
routing_qutrits = 12
expert_internal_layers = 2
moe_ff_active_internal_layers = 0
learning_rate_shift = 2

[features]
steane_correction = true
flash_cim = false
worker_threads = 32

[apis]
enabled = true
wolfram = false
pubchem = true
oeis = true
wikidata = false
arxiv = false
nasa = true
pdb = true
github = false
lean = false

[streaming]
enabled = true
port = 9090

[paths]
base_model = "C:/q_mini_data/checkpoints/final_model.json"
output_dir = "C:/q_mini_data/checkpoints/"
checkpoint_dir = "C:/q_mini_data/checkpoints/"
dataset_dir = "C:/q_mini_data/datasets/"

[data_sources]
urls = [
    "arxiv.org/abs/quant-ph",
    "mathworld.wolfram.com",
    "oeis.org",
    "datasets-server.huggingface.co",
    "huggingface.co/datasets/bigcode/the-stack",
    "ebi.ac.uk/chembl",
    "materialsproject.org",
    "dbpedia.org",
    "yago-knowledge.org",
    "ensembl.org",
    "dbpedia.org",
    "yago-knowledge.org",
    "ensembl.org",
    "gamma.sympy.org",
    "github.com/leanprover-community/mathlib4",
    "arxiv.org",
    "wolframalpha.com",
    "wikidata.org",
    "pubchem.ncbi.nlm.nih.gov",
    "rcsb.org",
    "oeis.org",
    "export.arxiv.org",
    "query.wikidata.org",
    "oeis.org",
    "api.openalex.org",
    "gutendex.com",
    "earthquake.usgs.gov",
    "api.spacexdata.com",
    "chroniclingamerica.loc.gov",
    "api.gbif.org",
    "data/wikipedia_math",
    "data/stackexchange_physics"
]
recursive = true
max_depth = 5
max_pages_per_source = 50000
