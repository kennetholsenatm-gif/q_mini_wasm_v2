version: '3.8'

services:
  # BitNet Local LLM Service
  bitnet-llm:
    build:
      context: ../models/bitnet
      dockerfile: Dockerfile
    container_name: bitnet-llm
    hostname: bitnet-llm
    networks:
      - mesh_net
    ports:
      - "8000:8000"  # API endpoint
      - "8001:8001"  # Prometheus metrics
    environment:
      - CONFIG_PATH=/app/config.json
      - PYTHONPATH=/app
      - CUDA_VISIBLE_DEVICES=0
      - TORCH_USE_CUDA_DSA=1
      - HF_HOME=/app/.cache
    volumes:
      - ../models/bitnet:/app
      - bitnet_models:/app/models
      - bitnet_cache:/app/.cache
      - bitnet_logs:/app/logs
    restart: unless-stopped
    privileged: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      bash -c "
        pip install -r requirements.txt &&
        python api/server.py
      "

  # BitNet Model Downloader (One-time service)
  bitnet-downloader:
    image: python:3.10-slim
    container_name: bitnet-downloader
    hostname: bitnet-downloader
    networks:
      - mesh_net
    environment:
      - HF_HOME=/app/.cache
    volumes:
      - ../models/bitnet:/app
      - bitnet_models:/app/models
      - bitnet_cache:/app/.cache
    command: >
      bash -c "
        pip install huggingface_hub &&
        python -c '
        from huggingface_hub import snapshot_download
        import os
        
        # Download BitNet model
        model_path = \"microsoft/bitnet-b1-8k-base\"
        local_path = \"/app/models/bitnet-1.58b\"
        
        print(f\"Downloading {model_path} to {local_path}\")
        snapshot_download(
            repo_id=model_path,
            local_dir=local_path,
            local_dir_use_symlinks=False,
            resume_download=True
        )
        print(\"Model download completed\")
        '
      "
    profiles:
      - setup

volumes:
  bitnet_models:
    driver: local
  bitnet_cache:
    driver: local
  bitnet_logs:
    driver: local

networks:
  mesh_net:
    external: true
    name: mesh_net