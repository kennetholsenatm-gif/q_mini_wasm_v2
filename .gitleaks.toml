# Gitleaks allowlist for LLM_Pract
# Only example/placeholder content is allowlisted; no real secrets.
# See .cursor/plans or docs for review process. Re-run Security workflow to verify.

title = "LLM_Pract allowlist for example and placeholder content"

[allowlist]
description = "Example env files and docs with placeholder credentials only"
paths = [
  # Any path ending in .env.example (root and subdirs)
  ".*\\.env\\.example$",
  # Example docs that may contain sample connection strings
  "^docs/.*\\.md$",
  "^infra/.*README\\.md$",
  "^containers/.*README\\.md$",
]
