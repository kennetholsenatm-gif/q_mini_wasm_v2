# Generated by training-wui dynamic schema form

[checkpoint]
load_path = "artifacts/models/my-run/latest.pt"

[data]
path = "qminiwasm/hf-multi"
source = "mesh"

[eval]
every_epoch = true

[hardware]
accelerator = "xpu"
quantum_backend = "penny_lane"

[huggingface]
# data.path is a reserved placeholder; training loads only [huggingface].extra_specs.
dataset_config = "repo/dataset"
num_samples = 1000000
split = "train"
extra_specs = [
  { path = "teknium/OpenHermes-2.5" },
  { path = "meta-math/MetaMathQA" },
  { path = "Open-Orca/OpenOrca" },
  { path = "ise-uiuc/Magicoder-Evol-Instruct-110K" },
  { path = "tuandunghcmut/toolbench-v1", dataset_config = "default" },
  { path = "migtissera/Synthia-v1.3" },
  { path = "code-search-net/code_search_net", dataset_config = "python" },
  { path = "code-search-net/code_search_net", dataset_config = "java" },
  { path = "google-research-datasets/mbpp", dataset_config = "full" },
]

[training]
batch_size = 32
epochs = 40
learning_rate = 0.0001
lr_plateau_factor = 0.7
lr_plateau_min_lr = 1e-06
lr_plateau_patience = 1

