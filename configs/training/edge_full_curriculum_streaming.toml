# Full curated curriculum with bounded streaming for edge hardware.
[hardware]
accelerator = "xpu"
qaoa_execution_mode = "qiskit_statevector"
qaoa_simulator_backend = "mps"

[training]
epochs = 6
batch_size = 12
learning_rate = 1.0e-4
grad_clip_norm = 1.0
lr_plateau_patience = 2

[data]
source = "hf_tabular"
path = "teknium/OpenHermes-2.5"
mesh_algorithms = "hash,encrypt,network,routing,consensus"

[huggingface]
split = "train"
streaming = true
num_samples = 80000
max_scan_rows = 400000
max_buffered_rows = 4096
text_truncate_bytes = 4096
deterministic_keep_every_n = 2
mesh_blend_fraction = 0.10
extra_specs = [
  { path = "meta-math/MetaMathQA" },
  { path = "Open-Orca/OpenOrca" },
  { path = "ise-uiuc/Magicoder-Evol-Instruct-110K" },
  { path = "tuandunghcmut/toolbench-v1", dataset_config = "default" },
  { path = "migtissera/Synthia-v1.3" },
  { path = "argilla/distilabel-capybara-dpo-7k" },
]

[eval]
holdout_fraction = 0.05
every_epoch = true

[cascade]
enabled = true
steps_per_epoch = 2
group_size = 4
