# Generated by training-wui Build + Run

[hardware]
accelerator = "cpu"
quantum_backend = "auto"
device_index = 0

[training]
epochs = 1
batch_size = 1
learning_rate = 0.0001
grad_clip_norm = 1.0

[checkpoint]
save_path = "artifacts/models/smoke-build/final.pt"
best_path = "artifacts/models/smoke-build/best.pt"
latest_path = "artifacts/models/smoke-build/latest.pt"

[data]
source = "mesh"
mesh_algorithms = "hash,encrypt,network,routing,consensus"

[cascade]
enabled = true
steps_per_epoch = 2
group_size = 4
