# Fast local iteration profile for integrated GPUs (16-32GB UMA).
[hardware]
accelerator = "xpu"
qaoa_execution_mode = "qiskit_statevector"
qaoa_simulator_backend = "mps"

[training]
epochs = 2
batch_size = 8
learning_rate = 1.0e-4
grad_clip_norm = 1.0
lr_plateau_patience = 1

[data]
source = "hf_tabular"
path = "ise-uiuc/Magicoder-Evol-Instruct-110K"
mesh_algorithms = "hash,encrypt,network,routing,consensus"

[huggingface]
split = "train"
streaming = true
num_samples = 6000
max_scan_rows = 24000
max_buffered_rows = 2048
text_truncate_bytes = 3072
deterministic_keep_every_n = 3
mesh_blend_fraction = 0.05
extra_specs = [
  { path = "meta-math/MetaMathQA" },
  { path = "argilla/distilabel-capybara-dpo-7k" },
]

[eval]
holdout_fraction = 0.05
every_epoch = true

[cascade]
enabled = true
steps_per_epoch = 1
group_size = 2
