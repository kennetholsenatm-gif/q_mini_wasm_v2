# Base for Cascade RL + MOPD continuation runs (see scripts/run_training_cascade_mopd.py).
# The script still injects CASCADE_MOPD_*, CHECKPOINT_*, etc. via env for one-off overrides.
# Omit mopd_lambda here so --mopd-lambda / injected env wins.

[hardware]
accelerator = "cpu"

[training]
epochs = 25
batch_size = 32

[data]
source = "mesh"
mesh_algorithms = "hash,encrypt,network,routing,consensus"

[cascade]
enabled = true
steps_per_epoch = 2
group_size = 4
state_dim = 8
num_actions = 4
# mopd_lambda = 0.1   # set via script / env instead
#
# Optional holdout eval (same as passing --eval-holdout / --eval-every-epoch to the script):
# [eval]
# holdout_fraction = 0.05
# every_epoch = true
#
# Edge profiling (Tier 1 micro / aggressive edge) — copy-paste or merge via WUI enclave_tier=1:
# [adapter]
# use_tsign_ternary = true
# hybrid_adapter = false
# lota_rank = 0
# [wasm]
# store_memory_limit_mb = 256
# [enclave]
# enclave_tier = "micro"
# use_memory64 = false
# enclave_footprint_mb = 250.0
#
# Edge profiling (Tier 3+ macro / Memory64) — WUI enclave_tier>=3:
# [enclave]
# enclave_tier = "macro"
# use_memory64 = true
# wasm_memory64_max_mb = 8192.0
# [wasm]
# store_memory_limit_mb = 8192
