# Phase 1 (CPU): coding-heavy warmup with mesh blend + Cascade RL + MOPD.
# Follow with stem_code_blend_phase2_gpu_resume.toml for GPU continuation.

[hardware]
accelerator = "cpu"

[training]
epochs = 12
batch_size = 16
learning_rate = 0.00012
grad_clip_norm = 1.0
lr_plateau_patience = 2
lr_plateau_factor = 0.5
lr_plateau_min_lr = 1.0e-7
seed = 42

[data]
source = "hf_tabular"
path = "code-search-net/code_search_net"
mesh_algorithms = "hash,encrypt,network,routing,consensus"

[huggingface]
dataset_config = "python"
split = "train"
num_samples = 25000
wasi_slice_only = false
wasi_max_scan = 150000
mesh_blend_fraction = 0.20

[checkpoint]
save_path = "artifacts/models/stem_code_blend_phase1_cpu/final.pt"
best_path = "artifacts/models/stem_code_blend_phase1_cpu/best.pt"
latest_path = "artifacts/models/stem_code_blend_phase1_cpu/latest.pt"

[eval]
holdout_fraction = 0.03
every_epoch = true
target_mean_mse = 0.0001
stop_on_target_mse = false

[cascade]
enabled = true
policy_lr = 0.000075
steps_per_epoch = 2
group_size = 4
state_dim = 8
num_actions = 4
mopd_lambda = 0.08
mopd_feat_loss = "mse"
seed_from_hidden = true
use_router = true
learned_projector = true
router_hidden = 32
couple_forward = true
