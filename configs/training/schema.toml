# Reference: training TOML layout (all tables/keys optional unless noted).
# Validated by qminiwasm.engine.training_schema.TrainingConfig (Pydantic).
# Do not put secrets here — use HUGGING_FACE_HUB_TOKEN / HF_TOKEN in the environment.
#
# Process-wide runtime toggles (impl selectors, fabric routing budget, SYCL strict helper, etc.)
# live in configs/runtime.toml — see qminiwasm.runtime_modes and docs/CONFIGURATION_POLICY.md.
# Training WUI server settings (gRPC addr, engine mode, RunPod SSH defaults) live in configs/wui.toml.
#
# Operational sizing uses Enclave Footprint (EF) tiers (see Concepts-Explained.md), not informal “model size” alone.

[hardware]
# accelerator = "cpu" | "cuda" | "xpu" | "sycl" | ...
# Note: "sycl" currently maps to torch XPU selection with CPU fallback.
# device_index = 0
# quantum_backend = "penny_lane"
# num_qubits = 8
# qaoa_layers = 3
# qaoa_execution_mode = "pennylane" | "qiskit_statevector" | "qiskit_ibm"
# ibm_qaoa_shots = 1024
# diff_method = "parameter-shift"

[training]
# epochs = 25
# batch_size = 32
# learning_rate = 1.0e-4
# seed = 42
# grad_clip_norm = 1.0
# lr_plateau_patience = 2
# lr_plateau_factor = 0.5
# lr_plateau_min_lr = 1.0e-7
# early_stop_patience = 0
# log_xpu_memory = false              # qmw_xpu_mem lines (XPU); configure in WUI schema / TOML
# log_xpu_memory_reset_peak = false   # per-epoch torch.xpu peak reset (with log_xpu_memory)
# log_train_throughput = false        # qmw_train_throughput (supervised wall time, samples/s, RSS)
# dataloader_num_workers = 4          # host DataLoader workers (0 = main process only); overlaps batch prep with device
# auto_stabilize = false              # XPU/SYCL: if grad_clip_norm / lr_plateau_patience unset, apply 1.0 clip + plateau patience 2

[model]
# d_model = 4096                      # internal width (ternary stack, adapter)
# num_ternary_blocks = 1              # residual PreNorm + ternary experts
# io_d_model = 4096                   # mesh/HF vector width; stem/head when != d_model
# tropical_attn_per_block = false     # residual geometric attention after ternary stack in hybrid_inference
# attention_backend = "tropical"      # when tropical_attn_per_block: tropical | bloch (fidelity on Bloch sphere)

[distributed]
# gradient_checkpointing = false
# gradient_accumulation_steps = 1
# amp = false                         # torch.autocast on cuda/xpu/cpu when supported
# fsdp = false                        # not applied (QMiniWASM is not nn.Module); reserved
# ddp = false                         # same as fsdp; use Python multi-process future work

[data]
# source = "mesh" | "corpus" | "hf_tabular"
# path = "optional DATA_PATH" — Hub dataset id, or reserved qminiwasm/hf-multi (extras-only; no primary load)
# mesh_algorithms = "hash,encrypt,network,routing,consensus"

[huggingface]
# dataset_config = "repo/dataset"
# dataset_revision = "main"
# num_samples = 1000
# split = "train"
# text_fields = ["field_a"]
# context_fields = ["field_b"]
# wasi_slice_only = false
# wasi_max_scan = 100
# mesh_blend_fraction = 0.0
# extra_specs = [ { path = "openai/gsm8k" }, { path = "wikitext", dataset_config = "wikitext-2-raw-v1" } ]
# (optional) Any number of extra Hub datasets (deduped by path+config); merged with [data].path when not qminiwasm/hf-multi.
# Curated Cascade smoke presets: curriculum_phase1_stem_example.toml, curriculum_phase1_code_example.toml,
# curriculum_phase3_cot_example.toml (docs/TRAINING_DATA.md § Curated Cascade curriculum).

[checkpoint]
# Convention: artifacts/models/<slug>/final.pt, best.pt, latest.pt (matches training WUI)
# Omit load_path for a fresh train; set only to resume from an existing .pt (e.g. latest.pt).
# save_path = "artifacts/models/my-run/final.pt"
# best_path = "artifacts/models/my-run/best.pt"
# latest_path = "artifacts/models/my-run/latest.pt"

[tpem]
# Preferred name for the same keys as [checkpoint] (trainable TPEM artifact paths).
# Per-field: when both tables set a key, [tpem] wins.
# load_path = "artifacts/models/my-run/latest.pt"

[eval]
# holdout_fraction = 0.0
# every_epoch = false
# early_stop_patience = 0     # holdout eval plateau (overfitting guard); needs every_epoch + holdout
# target_mean_mse = 1.0e-4
# stop_on_target_mse = false

[adapter]
# hybrid_adapter = false
# hybrid_adapter_hidden = 1024
# tequila_deadzone = 0.0
# lota_rank = 0
# use_tsign_ternary = false
# tsign_learning_rate = 0.001
# lota_merge_every_epoch = false

# Native C++ automated cascade (WUI → gRPC TrainingEngineService; not CASCADE_RL).
# [cascade_curriculum_loop]
# enabled = true
# max_heal_rounds = 2
# teacher_checkpoint_path = "artifacts/models/.../teacher.pt"   # required for max_curriculum_cycles > 1
# ptqtp_num_planes = 2
# gate_target_val_mse = 0          # 0 = disable absolute val-MSE gate; >0 = pass only if native val_loss <= this
# gate_max_tpem_mib = 0            # 0 = disable TPEM MiB cap gate; >0 = pass only if estimate <= this
# run_taxonomy_linter = false
# heal_learning_rate_scale = 0.5
# teacher_epoch_fraction = 0.5      # phase-1 teacher gets ceil(epochs * fraction) epochs
# heal_epochs_per_round = 2         # fallback when training.epochs <= teacher epochs (see below)
# max_curriculum_cycles = 1         # on gate fail: reload teacher ckpt and repeat PTQTP+heal
#
# Simulated Annealing (Metropolis-Hastings) for progressive quantization (Phase 2).
# Replaces greedy PTQTP with thermodynamic cooling: weights explore the ternary lattice
# via controlled noise injection before freezing to {-1, 0, +1} vertices.
# sa_initial_temperature = 1.0     # T_0: initial computational temperature (high = broad exploration)
# sa_cooling_rate = 0.95           # γ: per-epoch multiplier (T_{t+1} = T_t * γ)
# sa_min_temperature = 0.01        # T_min: floor temperature (below which weights are frozen)
# sa_acceptance_window = 0.5       # target acceptance rate for adaptive T adjustment (0-1, 0=disable)
#
# Tier-matched native cascade (training WUI): POST /api/training/native_cascade_apply merges
# configs/training/cascade_curriculum_native.toml with configs/training/native_cascade/tier_*.toml
# (edge_constrained, fog_node, xpu_cluster) using Enclave tier 1–5. Dataset id in [data] / [huggingface]
# stays from the base unless you change it in the wizard. After a run, GET /api/runs/{id}/artifacts_validate
# checks QMWTPEM2 interchange on checkpoint paths; GET /api/runs also embeds artifact_validation for finished runs.
#
# Epoch budget (Option B): training.epochs caps the whole native cascade run. Teacher uses the
# fraction above; remaining epochs are heal steps split across max_heal_rounds (at least one heal
# epoch total). If training.epochs <= teacher epochs, heal count falls back to
# heal_epochs_per_round * max_heal_rounds.

[cascade]
# enabled = true                    # CASCADE_RL
# policy_lr = 1.0e-4
# steps_per_epoch = 2
# group_size = 4                    # also native gRPC TrainingConfig.cascade_rl_group_size (GRPO/CISPO trajectories)
# state_dim = 8
# num_actions = 4
# mopd_lambda = 0.0
# mopd_feat_loss = "mse"            # or "cosine"
# seed_from_hidden = true
# use_router = false
# learned_projector = false
# router_hidden = 32
# couple_forward = true
# policy_optimizer = "grpo"           # grpo | cispo (default cascade policy loss when not using training_phases)
# cispo_clip_epsilon = 0.2            # symmetric clip on importance ratio for CISPO

# Unified Training Matrix (optional): when set, sum(phase.epochs) overrides [training].epochs.
# [[training_phases]]
# name = "sft"
# epochs = 3
# supervised = true
# cascade_rl = true
# freeze_model_backbone = false
# router_only = false
# cascade_policy_optimizer = "grpo"   # grpo | cispo
# cispo_clip_epsilon = 0.2            # optional per-phase override
# cascade_mopd_lambda = 0.0           # optional; defaults to [cascade].mopd_lambda when omitted
# tequila_deadzone = 0.0              # optional per-phase TernaryWASMExpert deadzone
# freeze_ternary_experts = false      # freeze expert weights only (when backbone not fully frozen)

[wasm]
# Wasmtime curriculum WASM limits (see qminiwasm.wasm_host.engine.WasmRuntimeConfig).
# Omit store_memory_limit_mb to use engine default (1e6 × d_model bytes, ~4 GiB cap).
# store_instance_limit / store_memories_limit default high in code (mesh data gen); lower on tiny hosts if needed.
# backend = "wasmtime"              # wasmtime | wasmedge_native | enclave_adapter (feature-flagged)
# fallback_policy = "mock"
# force_mock = false
# store_instance_limit =
# store_memories_limit =

[enclave]
# Enclave-as-Code runtime policy knobs (optional; defaults preserve existing behavior).
# enclave_tier = "micro"            # micro | meso | macro | workgroup | enterprise_core
# Tier defaults:
#   micro           -> 4096 pages (~256MiB), Memory64 off
#   meso            -> 32768 pages (~2GiB), Memory64 off
#   macro           -> 131072 pages (~8GiB), Memory64 on, memory64_max_mb=8192
#   workgroup       -> 262144 pages (~16GiB), Memory64 on, memory64_max_mb=16384
#   enterprise_core -> 4194304 pages (~256GiB), Memory64 on, memory64_max_mb=262144
# Override precedence: explicit overrides below > tier defaults > runtime defaults.
# enclave_footprint_mb = 250.0      # optional EF hint (policy/observability)
# certainty_scalar_threshold = 0.85
# max_linear_memory_pages = 131072  # explicit override
# wasm_memory64_max_mb = 8192.0     # explicit override
# use_memory64 = true               # explicit override

# Reserved / future: stabilizer path & router cost hooks (see docs/research/ARCHITECTURE_WHITEPAPERS.md,
# Ternary Clifford Optimization pillar traceability). Not read by TrainingConfig yet.
# [quantum_clifford]
# max_local_qubits = 8
# enable_stabilizer_path = false
# qpu_t_gate_penalty = 1.0

[serve]
# Used when loading configs/serve/*.toml (inference). Optional in training files.
# d_model = 4096                      # optional override if checkpoint lacks geometry
# num_ternary_blocks = 1
# io_d_model = 4096
# checkpoint = "path/to.ckpt"
# hybrid_adapter = false
# hybrid_adapter_hidden = 1024
# use_cascade_router = false
# cascade_state_dim = 8
# cascade_num_actions = 4
# cascade_router_hidden = 32
