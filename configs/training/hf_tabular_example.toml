# Example: Hugging Face tabular/code dataset (set HF_DATASET_CONFIG and HF_TOKEN in .env).

[hardware]
accelerator = "cpu"

[training]
epochs = 25
batch_size = 32
learning_rate = 0.00015
grad_clip_norm = 1.0
lr_plateau_patience = 2

[data]
source = "hf_tabular"

[huggingface]
# dataset_config = "owner/dataset_name"   # prefer HF_DATASET_CONFIG in .env for secrets-free commits
split = "train"
wasi_slice_only = false

[eval]
target_mean_mse = 0.0001
stop_on_target_mse = false

[cascade]
enabled = true
policy_lr = 0.000075
