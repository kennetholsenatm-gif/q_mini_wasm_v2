# Smoke-scale Phase 1 code / execution mix (xCodeEval + coding-eval narrative) per QMINIWASM Dataset and Expert Curation.
# xCodeEval is multi-config: pick a config name from https://huggingface.co/datasets/NTU-NLP-sg/xCodeEval
# coding-eval may require HF_TOKEN / license acceptance.
# Native + Python: set text_fields so row text matches your chosen config's string columns.

[hardware]
accelerator = "cpu"

[training]
epochs = 2
batch_size = 8
learning_rate = 0.00015
seed = 42

[data]
source = "hf_tabular"
path = "NTU-NLP-sg/xCodeEval"

[huggingface]
# Example config placeholder — replace with a real subset (e.g. code compilation task) from the dataset README.
dataset_config = "default"
split = "train"
num_samples = 64
# Replace with actual column names for the chosen config (often multiple string fields).
text_fields = ["src", "tgt"]

[[huggingface.extra_specs]]
path = "nex-agi/coding-eval"
dataset_config = "default"

[model]
d_model = 4096
io_d_model = 4096
num_ternary_blocks = 1
