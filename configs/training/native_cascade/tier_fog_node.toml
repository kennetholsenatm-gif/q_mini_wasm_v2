# Native cascade overlay — WUI tier 2 (fog_node / meso taxonomy). Production run defaults.

[enclave]
enclave_tier = 2

[training]
epochs = 480

[huggingface]
num_samples = 65536

[model]
d_model = 1024
io_d_model = 1024
num_ternary_blocks = 2

[cascade_curriculum_loop]
gate_max_tpem_mib = 4096
teacher_checkpoint_path = "artifacts/models/cascade_native_fog/teacher.pt"
max_heal_rounds = 8
heal_epochs_per_round = 8
max_curriculum_cycles = 2

[checkpoint]
save_path = "artifacts/models/cascade_native_fog/final.pt"
best_path = "artifacts/models/cascade_native_fog/best.pt"
latest_path = "artifacts/models/cascade_native_fog/latest.pt"
