# Tier 4 (XPU Cluster) native cascade curriculum loop configuration
# Designed for d_model=8192 at XPU cluster tier with larger expert counts.
# This is a Tier 4 template; merge with a base training config that sets
# training.epochs, training.batch_size, [data], [huggingface], [checkpoint].

[cascade_curriculum_loop]
enabled = true
max_heal_rounds = 4
ptqtp_num_planes = 2
gate_target_val_mse = 0
gate_max_tpem_mib = 0
run_taxonomy_linter = false
heal_learning_rate_scale = 0.5
teacher_epoch_fraction = 0.5
heal_epochs_per_round = 3
max_curriculum_cycles = 1

# Simulated Annealing for progressive quantization (Phase 2)
sa_initial_temperature = 1.0
sa_cooling_rate = 0.95
sa_min_temperature = 0.01
sa_acceptance_window = 0.5

# Real FP32 teacher from external checkpoint (use load_teacher_from_interchange)
# teacher_checkpoint_path should be set to the best Phase 1 (SFT) checkpoint

[model]
d_model = 8192
num_ternary_blocks = 2
io_d_model = 8192
attention_backend = "tropical"

[training]
epochs = 50
batch_size = 64
learning_rate = 1.0e-4
seed = 42
grad_clip_norm = 1.0
lr_plateau_patience = 3
lr_plateau_factor = 0.5
lr_plateau_min_lr = 1.0e-6
early_stop_patience = 8