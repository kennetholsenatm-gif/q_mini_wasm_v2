# Native cascade overlay — WUI enclave tiers 3–5 (macro / xpu_cluster taxonomy).
# ~1e9 trainable scalars (ternary STE + PTQTP). Merged onto cascade_curriculum_native.toml.

[enclave]
enclave_tier = 3

[training]
epochs = 480
# batch_size: omitted — WUI gRPC maps native cascade with automatic batch from model geometry.

[huggingface]
num_samples = 262144

[model]
d_model = 8192
io_d_model = 8192
num_ternary_blocks = 15

[cascade_curriculum_loop]
gate_max_tpem_mib = 16384
teacher_checkpoint_path = "artifacts/models/cascade_native_xpu/teacher.pt"
max_heal_rounds = 8
heal_epochs_per_round = 8
max_curriculum_cycles = 2

[checkpoint]
save_path = "artifacts/models/cascade_native_xpu/final.pt"
best_path = "artifacts/models/cascade_native_xpu/best.pt"
latest_path = "artifacts/models/cascade_native_xpu/latest.pt"
