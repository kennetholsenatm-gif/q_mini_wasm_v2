# Generated by training-wui Build + Run
# Mode: learning-rate trial run (short budget)
# Requested data_source=hybrid_mesh_hf_tabular -> source=hf_tabular + mesh_blend_fraction>0

[hardware]
accelerator = "cuda"
quantum_backend = "penny_lane"
device_index = 0

[training]
epochs = 25
batch_size = 32
learning_rate = 0.0001
grad_clip_norm = 1.0

[checkpoint]
save_path = "artifacts/quantum-test.pt"
best_path = "artifacts/quantum-test_best.pt"
latest_path = "artifacts/quantum-test_latest.pt"

load_path = "artifacts/quantum-test_latest.pt"

[data]
source = "hf_tabular"
path = "AI-MO/NuminaMath-CoT"
mesh_algorithms = "hash,encrypt,network,routing,consensus"

[huggingface]
split = "train"
mesh_blend_fraction = 0.2

[eval]
holdout_fraction = 0.05
every_epoch = true

[cascade]
enabled = true
steps_per_epoch = 2
group_size = 4
