# Generated by training-wui Build + Run
# Mode: learning-rate trial run (short budget)
# Requested data_source=hybrid_mesh_hf_tabular -> source=hf_tabular + mesh_blend_fraction>0

[hardware]
accelerator = "xpu"
quantum_backend = "penny_lane"
device_index = 0

[training]
epochs = 50
batch_size = 32
learning_rate = 0.0001
grad_clip_norm = 1.0

[checkpoint]
save_path = "artifacts/models/quantum-test/final.pt"
best_path = "artifacts/models/quantum-test/best.pt"
latest_path = "artifacts/models/quantum-test/latest.pt"

load_path = "artifacts/models/quantum-test/latest.pt"

[data]
source = "hf_tabular"
path = "hendrycks/competition_math"
mesh_algorithms = "hash,encrypt,network,routing,consensus"

[huggingface]
split = "train"
mesh_blend_fraction = 0.2
extra_specs = [
  { path = "code-search-net/code_search_net", dataset_config = "python" },
  { path = "code-search-net/code_search_net", dataset_config = "java" },
  { path = "code-search-net/code_search_net", dataset_config = "javascript" },
  { path = "google-research-datasets/mbpp", dataset_config = "full" },
  { path = "neulab/docprompting-conala" },
  { path = "AI-MO/NuminaMath-CoT" },
  { path = "openai/gsm8k" },
  { path = "wikitext", dataset_config = "wikitext-2-raw-v1" },
]

[eval]
holdout_fraction = 0.05
every_epoch = true

[cascade]
enabled = true
steps_per_epoch = 2
group_size = 4
