# Smoke-scale Phase 1 (STEM / logic) mix aligned with docs/research/QMINIWASM Dataset and Expert Curation.md.
# OpenMathInstruct-2 + OpenR1-Math-220k: wide basins before quantization. Uses hf_tabular identity-MSE
# on encode_linear_memory — not full logits SFT. Verify row keys on the Hub; set text_fields if auto/heuristic fails.

[hardware]
accelerator = "cpu"

[training]
epochs = 2
batch_size = 8
learning_rate = 0.00015
seed = 42

[data]
source = "hf_tabular"
path = "open-r1/OpenR1-Math-220k"

[huggingface]
dataset_config = "default"
split = "train"
num_samples = 128
# Typical math-instruction layouts use problem/solution or prompt/response — adjust after inspecting the dataset card.
text_fields = ["problem", "solution"]

[[huggingface.extra_specs]]
path = "nvidia/OpenMathInstruct-2"
dataset_config = "default"

[model]
d_model = 4096
io_d_model = 4096
num_ternary_blocks = 1
