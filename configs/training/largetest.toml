# Generated by training-wui dynamic schema form

[checkpoint]
load_path = "artifacts/models/my-run/latest.pt"

[data]
path = "qminiwasm/hf-multi"
source = "hf_tabular"

[eval]
every_epoch = true

[hardware]
accelerator = "xpu"
quantum_backend = "penny_lane"

[huggingface]
# Primary dataset_config is unused when data.path is qminiwasm/hf-multi; training uses extra_specs only.
mesh_blend_fraction = 0.2
num_samples = 1000000
split = "train"
extra_specs = [
  { path = "code-search-net/code_search_net", dataset_config = "python" },
]

[training]
batch_size = 32
epochs = 40
learning_rate = 0.0001
lr_plateau_factor = 0.7
lr_plateau_min_lr = 1e-06
lr_plateau_patience = 1

