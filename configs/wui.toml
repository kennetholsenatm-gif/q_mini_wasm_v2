# Training WUI runtime settings (revision-controlled).
# Secrets (API tokens) stay in .env only — see docs/CONFIGURATION_POLICY.md

[wui]
# Default: native C++ LibTorch engine (gRPC). Use "auto" to fall back to Python if gRPC is down; "python" for full PyTorch loop only.
training_runtime_mode = "native" # native | grpc | cpp | auto | python | optimized
grpc_addr = "127.0.0.1:50061"

[wui.runpod]
ssh_user = "root"
remote_dir = "/workspace/qminiwasm-core"
# ssh_key_path = ""  # optional; empty uses ssh default identity

# Shown in GET /api/meta (runtime_profile) — mirrors Python configs/runtime.toml where applicable
[wui.runtime_profile]
ternary_impl = "auto"
trit_pack_impl = "auto"
memory_encode_impl = "auto"
wasm_exec_impl = "auto"
cascade_rl_impl = "auto"
tpem_native_bundle = "0"
native_strict_enabled = false
