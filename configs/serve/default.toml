# Inference defaults (override with env in containers: ACCELERATOR, QMINIWASM_CHECKPOINT, ...).
# Enclave tier presets (EF = Enclave Footprint). Uncomment one [enclave] block if overriding defaults.
#
# Tier 1 Micro-Enclave  (EF < 250 MiB):
#   enclave_tier = "micro"
#   enclave_footprint_mb = 248.0
# Tier 2 Meso-Enclave   (~2 GiB EF):
#   enclave_tier = "meso"
#   enclave_footprint_mb = 2048.0
# Tier 3 Macro-Enclave  (~8 GiB EF, Memory64):
#   (see active [enclave] below)
# Tier 4 Workgroup      (~16 GiB EF):
#   enclave_tier = "workgroup"
#   enclave_footprint_mb = 16384.0
# Tier 5 Enterprise Core (256+ GiB EF; datacenter / host orchestrated):
#   enclave_tier = "enterprise_core"
#   enclave_footprint_mb = 262144.0

[serve]
# checkpoint = "checkpoints/latest.pt"
hybrid_adapter = false
hybrid_adapter_hidden = 1024
use_cascade_router = false
cascade_state_dim = 8
cascade_num_actions = 4
cascade_router_hidden = 32

# TPEM / Macro-Enclave defaults: ~8 GiB linear memory bound (Memory64), ~40B effective @ 1.6 bit/weight.
[enclave]
enclave_tier = "macro"
enclave_footprint_mb = 8192.0
certainty_scalar_threshold = 0.85
wasm_memory64_max_mb = 8192.0
use_memory64 = true
# 8192 MiB / 64 KiB per page = 131072 pages
max_linear_memory_pages = 131072
