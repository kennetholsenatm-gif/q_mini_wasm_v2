syntax = "proto3";

package qminiwasm.trainingrpc;

option go_package = "github.com/kennetholsenatm-gif/qminiwasm-core/training-wui/trainingrpc;trainingrpc";

// Hugging Face tabular fetch + encoding hints for the native C++ training engine.
message HfDatasetParams {
  string dataset_id = 1;
  string config_name = 2;
  string split = 3;
  string revision = 4;
  uint32 num_samples = 5;
  double mesh_blend_fraction = 6;
  // Ordered row keys for native HF fetch + parity with Python hf_tabular text_fields (empty = legacy concat).
  repeated string text_fields = 7;
}

// Automated cascade curriculum: teacher fit to PTQTP on student to heal vs frozen teacher to optional gate.
message CascadeCurriculumLoopParams {
  bool enabled = 1;
  uint32 max_heal_rounds = 2;
  string teacher_checkpoint_path = 3;
  uint32 ptqtp_num_planes = 4;
  double gate_target_val_mse = 5;
  double gate_max_tpem_mib = 6;
  bool run_taxonomy_linter = 7;
  double heal_learning_rate_scale = 8;
  double teacher_epoch_fraction = 9;
  uint32 heal_epochs_per_round = 10;
  uint32 max_curriculum_cycles = 11;
}

// One row of [[training_phases]] (Unified Training Matrix). See docs/research/ARCHITECTURE_WHITEPAPERS.md.
message TrainingPhaseParams {
  string name = 1;
  uint32 epochs = 2;
  // When both supervised and cascade_rl are true, the native LibTorch engine runs one combined step per tick
  // (MSE on CoreModule micro-batch + weighted toy GRPO/CISPO on CascadeToyPolicy); see libtorch_ternary_trainer.hpp.
  bool supervised = 3;
  bool cascade_rl = 4;
  bool freeze_model_backbone = 5;
  bool router_only = 6;
  string cascade_policy_optimizer = 7;
  optional double cispo_clip_epsilon = 8;
  optional double cascade_mopd_lambda = 9;
  optional double tequila_deadzone = 10;
  bool freeze_ternary_experts = 11;
  // Absolute path: MOPD teacher interchange v2 for this phase (optional).
  string mopd_teacher_checkpoint_path = 12;
}

message TrainingConfig {
  string run_id = 1;
  string dataset_uri = 2;
  string model_uri = 3;
  uint32 epochs = 4;
  uint32 batch_size = 5;
  uint32 micro_batch_size = 6;
  uint32 prefetch_depth = 7;
  uint32 compute_slots = 8;
  uint32 worker_threads = 9;
  double learning_rate = 10;
  uint64 seed = 11;
  string taxonomy_tier = 12;
  string precision_policy = 13;
  string checkpoint_save_path = 14;
  string checkpoint_best_path = 15;
  string checkpoint_latest_path = 16;
  uint32 d_model = 17;
  uint32 io_d_model = 18;
  uint32 num_ternary_blocks = 19;
  HfDatasetParams hf = 20;
  CascadeCurriculumLoopParams cascade_loop = 21;
  bool use_native_engine_only = 22;
  repeated TrainingPhaseParams training_phases = 23;
  string cascade_policy_optimizer = 24;
  double cispo_clip_epsilon = 25;
  string attention_backend = 26;
  // GRPO/CISPO trajectory batch size for native LibTorch toy cascade RL ([cascade] group_size in TOML). Default 4.
  uint32 cascade_rl_group_size = 27;
  // Native LibTorch Bloch attention: sequence length for broadcast token + learnable pos_embed (after stem). 0 = default 8 when attention_backend=bloch.
  uint32 native_bloch_seq_len = 28;
  // Native Bloch head count; 0 = default 4 (adjusted down so d_model is divisible). Ignored when attention_backend != bloch.
  uint32 native_bloch_num_heads = 29;
}

message StartTrainingRequest {
  TrainingConfig config = 1;
}

message NativeColdStartMemoryEstimate {
  uint64 parameter_bytes_fp32 = 1;
  uint64 adam_state_bytes_fp32 = 2;
  uint64 activation_scratch_bytes_hint = 3;
  string formula_summary = 4;
  uint32 effective_d_model = 5;
  uint32 effective_io_d_model = 6;
  uint32 effective_num_ternary_blocks = 7;
  uint32 batch_size = 8;
  bool model_uri_checkpoint_load = 9;
}

message StartTrainingResponse {
  bool accepted = 1;
  string message = 2;
  string run_id = 3;
  NativeColdStartMemoryEstimate memory_estimate = 4;
}

message StopTrainingRequest {
  string run_id = 1;
}

message StopTrainingResponse {
  bool accepted = 1;
  string message = 2;
}

message StatusRequest {
  string run_id = 1;
}

message StatusResponse {
  enum EngineState {
    ENGINE_STATE_UNSPECIFIED = 0;
    ENGINE_STATE_IDLE = 1;
    ENGINE_STATE_STARTING = 2;
    ENGINE_STATE_RUNNING = 3;
    ENGINE_STATE_STOPPING = 4;
    ENGINE_STATE_STOPPED = 5;
    ENGINE_STATE_FAILED = 6;
  }
  EngineState state = 1;
  string run_id = 2;
  uint32 epoch = 3;
  uint32 step = 4;
  double train_loss = 5;
  double val_loss = 6;
  double learning_rate = 7;
  string message = 8;
}

message TelemetryRequest {
  string run_id = 1;
  bool include_debug = 2;
}

message TelemetryEvent {
  string run_id = 1;
  uint64 unix_ms = 2;
  uint32 epoch = 3;
  uint32 step = 4;
  double train_loss = 5;
  double val_loss = 6;
  double learning_rate = 7;
  double samples_per_second = 8;
  uint32 sampler_queue_depth = 9;
  uint32 prefetch_queue_depth = 10;
  uint32 compute_queue_depth = 11;
  string taxonomy_tier = 12;
  string precision_mode = 13;
  string stage = 14;
  string event_type = 15;
  string message = 16;
  string graph_id = 17;
  string node_id = 18;
  string enclave_state = 19;
  string attestation_state = 20;
  double decoherence_score = 21;
  double epoch_wall_s = 22;
  uint32 epoch_batch_count = 23;
  uint64 epoch_sample_count = 24;
  double epoch_mean_samples_per_s = 25;
  double host_rss_mib = 26;
  double estimated_tpem_mib = 27;
  double tier_cap_mib = 28;
  // Unified Training Matrix: active phase name from TOML (e.g. sft, mopd).
  string training_phase = 29;
  // Effective cascade policy for this segment: grpo or cispo (empty if N/A).
  string cascade_policy_optimizer = 30;
}

service TrainingEngineService {
  rpc StartTraining(StartTrainingRequest) returns (StartTrainingResponse);
  rpc StopTraining(StopTrainingRequest) returns (StopTrainingResponse);
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc StreamTelemetry(TelemetryRequest) returns (stream TelemetryEvent);
}
