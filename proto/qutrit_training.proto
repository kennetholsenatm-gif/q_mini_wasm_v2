syntax = "proto3";

package qminiwasm.quantum;

option go_package = "github.com/kennetholsenatm-gif/qminiwasm-core/training-wui/qutrittrainingrpc";

// ============================================================================
// Qutrit Clifford Training Service
// ============================================================================
// Provides gRPC interface for Qutrit Clifford training operations.
// Implements the three-phase training paradigm:
//   1. Quantum Superposition over Simulated Annealing
//   2. Entanglement-Based Loss Optimization
//   3. Hybrid Execution via Stabilizer Tableaus
// ============================================================================

service QutritTrainingService {
  // Phase 1: Quantum Superposition
  rpc InitializeSuperposition(InitializeSuperpositionRequest) returns (InitializeSuperpositionResponse);
  rpc ApplyHadamardLayer(ApplyHadamardLayerRequest) returns (ApplyHadamardLayerResponse);
  rpc LatticeCollapse(LatticeCollapseRequest) returns (LatticeCollapseResponse);

  // Phase 2: Entanglement-Based Optimization
  rpc ApplyControlledZ(ApplyControlledZRequest) returns (ApplyControlledZResponse);
  rpc PushNoisePhase(PushNoisePhaseRequest) returns (PushNoisePhaseResponse);
  rpc ExtractErrorSyndrome(ExtractErrorSyndromeRequest) returns (ExtractErrorSyndromeResponse);

  // Phase 3: Stabilizer Tableau Engine
  rpc UpdatePhaseTableau(UpdatePhaseTableauRequest) returns (UpdatePhaseTableauResponse);
  rpc GetTrainingMetrics(GetTrainingMetricsRequest) returns (GetTrainingMetricsResponse);
  rpc GetTableauState(GetTableauStateRequest) returns (GetTableauStateResponse);
}

// ============================================================================
// Phase 1: Quantum Superposition Messages
// ============================================================================

message InitializeSuperpositionRequest {
  int32 n_params = 1;  // Number of parameters to initialize
  uint64 seed = 2;     // Random seed for reproducibility
}

message InitializeSuperpositionResponse {
  int64 tableau_id = 1;
  bool success = 2;
  string error = 3;
}

message ApplyHadamardLayerRequest {
  int64 tableau_id = 1;
  repeated int32 qubits = 2;  // Qubits to apply H₃ to (empty = all)
}

message ApplyHadamardLayerResponse {
  bool success = 1;
  string error = 2;
}

message LatticeCollapseRequest {
  int64 tableau_id = 1;
  int32 n_measurements = 2;  // Number of measurement shots
}

message LatticeCollapseResponse {
  repeated int32 collapsed_weights = 1;  // Final ternary weights {-1, 0, 1}
  repeated float probabilities = 2;      // Measurement probabilities
  bool success = 3;
  string error = 4;
}

// ============================================================================
// Phase 2: Entanglement-Based Optimization Messages
// ============================================================================

message ApplyControlledZRequest {
  int64 tableau_id = 1;
  int32 control = 2;
  int32 target = 3;
  int32 power = 4;  // CZ₃^power (default 1)
}

message ApplyControlledZResponse {
  bool success = 1;
  string error = 2;
}

message PushNoisePhaseRequest {
  int64 tableau_id = 1;
  int32 phase = 2;  // Phase value in {0, 1, 2}
}

message PushNoisePhaseResponse {
  bool success = 1;
  string error = 2;
}

message ExtractErrorSyndromeRequest {
  int64 tableau_id = 1;
}

message ExtractErrorSyndromeResponse {
  repeated int32 syndrome = 1;
  bool has_error = 2;
  bool success = 3;
  string error = 4;
}

// ============================================================================
// Phase 3: Stabilizer Tableau Engine Messages
// ============================================================================

message UpdatePhaseTableauRequest {
  int64 tableau_id = 1;
  repeated int32 phase_updates = 2;  // Phase updates per qubit
}

message UpdatePhaseTableauResponse {
  bool success = 1;
  string error = 2;
}

message GetTrainingMetricsRequest {
  int64 tableau_id = 1;
}

message GetTrainingMetricsResponse {
  int64 total_epochs = 1;
  int64 successful_epochs = 2;
  float current_loss = 3;
  float best_loss = 4;
  repeated float loss_history = 5;
  bool success = 6;
  string error = 7;
}

message GetTableauStateRequest {
  int64 tableau_id = 1;
}

message GetTableauStateResponse {
  repeated int32 x_components = 1;  // X components of stabilizers
  repeated int32 z_components = 2;  // Z components of stabilizers
  repeated int32 phases = 3;        // Phase values
  int32 n_qubits = 4;
  bool success = 5;
  string error = 6;
}