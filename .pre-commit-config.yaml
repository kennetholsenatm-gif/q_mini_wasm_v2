# DevSecOps shift-left: quality and security hooks
# Install: pre-commit install && pre-commit install --hook-type commit-msg
# Run all: pre-commit run --all-files
default_language_version:
  python: python3.11

repos:
  - repo: local
    hooks:
      - id: validate-commit-msg
        name: Validate commit message (conventional)
        entry: bash scripts/validate-commit-msg.sh
        language: system
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ["--maxkb=1000"]
      - id: detect-private-key
      - id: debug-statements

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        language_version: python3.11
        args: ["--line-length=100"]
        files: ^(qminiwasm|tests|wui/backend)/.*\.py$

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ["--max-line-length=100", "--extend-ignore=E203,W503"]
        files: ^(qminiwasm|tests|wui/backend)/.*\.py$

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        additional_dependencies: [types-all]
        args: [--ignore-missing-imports]
        files: ^qminiwasm/.*\.py$
        pass_filenames: false

  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        args: ["-c", "pyproject.toml"]
        additional_dependencies: ["bandit[toml]"]
        files: ^(qminiwasm|wui/backend)/.*\.py$

  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.4.0
    hooks:
      - id: detect-secrets
        args: ["--baseline", ".secrets.baseline"]
        exclude: (\.lock|requirements.*\.txt|\.json)$
        pass_filenames: false

  - repo: https://github.com/kynan/branch-validator
    rev: v1.0.0
    hooks:
      - id: branch-validator
        args:
          - --pattern=^(master|develop|feature/.*|bugfix/.*|release/.*|security/.*|dev/.*)$
          - --message="Branch name must follow GitFlow conventions: master, develop, feature/, bugfix/, release/, security/, or dev/"

  - repo: local
    hooks:
      - id: generate-env-docs
        name: Generate environment variables documentation
        entry: python scripts/generate_env_docs.py
        language: system
        files: \.env\.schema$
        pass_filenames: false
